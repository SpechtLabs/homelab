# Every night after the upgrades (03:00, nightly-upgrades.yaml): reboot the
# hosts whose newer kernel is installed but not running (modules/base, action
# `reboot-if-required`). The upgrade action only reboots when its own run
# changed something, so a kernel installed by an earlier run, or by hand,
# would otherwise wait forever. Same phases: the blades together, core two at
# a time, then the fleet phase with one Ceph host and one k3s node at a time
# (drained around the reboot), gated on health; a host with nothing pending
# doesn't reboot.
description: Reboot hosts with a pending kernel, one phase at a time.
cron: "30 5 * * *"
timezone: Europe/Berlin
module: base
action: reboot-if-required
approval: auto
window: 2h
note: Nightly reboots for pending kernels
