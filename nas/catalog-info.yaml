# Backstage catalog entries for the Synology: the box (Resource), DSM and the
# compose projects in this directory (Components). Referenced from the Location
# in the repo-root catalog-info.yaml. Deployed through DSM, not Buckle
# (README.md here).
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: nas
  title: Synology NAS
  description: The Synology at home (LAN 192.168.0.64, tailnet `nas`), on DSM.
  tags: [synology]
spec:
  type: nas
  owner: group:spechtlabs
  system: elbschloss
  dependsOn:
    - resource:home-lan
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: synology-dsm
  title: Synology DSM
  description: >-
    DSM on the NAS: web UI and Drive (sign-in through tsidp), Container
    Manager for the projects here, and NFS exports.
  annotations:
    github.com/project-slug: SpechtLabs/homelab
  links:
    - url: https://nas.sphinx-map.ts.net
      title: DSM
spec:
  type: service
  owner: group:spechtlabs
  system: elbschloss
  lifecycle: production
  providesApis:
    - api:nas-nfs
    - api:synology-dsm-web
    - api:synology-dsm-https
    - api:synology-drive
  consumesApis:
    - api:tsidp-oidc
  dependsOn:
    - resource:nas
    - resource:tailnet
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: nas-nfs
  title: NAS NFS exports
  description: NFS v4.1 shares on the Synology, through the Tailscale Service svc:nfs.
  annotations:
    # Where tailnet consumers reach it. Backstage renders the tailnet policy's
    # grants from these (tailscale/policy/).
    specht-labs.de/tailnet-dst: svc:nfs
    specht-labs.de/tailnet-ports: tcp:2049
spec:
  type: nfs
  owner: group:spechtlabs
  system: elbschloss
  lifecycle: production
  definition: |
    NFS v4.1 from nfs.sphinx-map.ts.net (svc:nfs, tcp:2049 only). The NAS's
    tailscaled forwards it to 127.0.0.1:2049, so DSM sees every client as
    localhost on a high port: exports are per shared folder (DSM: Shared
    Folder > NFS Permissions) for 127.0.0.1 with non-privileged ports
    allowed, and the tailnet policy decides who reaches svc:nfs.

    /volume1/homelab          read/write, no squash; one folder per
                              nightly backup (modules/nas-backup,
                              vars/backups.yaml): buckle, buckle-secrets,
                              tsidp, k3s
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: synology-dsm-web
  title: DSM web UI
  description: DSM's web UI and API through the Tailscale Service svc:nas.
  annotations:
    # Where tailnet consumers (the o11y collector's probe) reach it, and who
    # else may: Backstage renders the tailnet policy's grants from these
    # (tailscale/policy/). svc:nas passes every port through to the NAS, so
    # each port is an API of its own: 443 here, 5001 and 6690 below.
    specht-labs.de/tailnet-dst: svc:nas
    specht-labs.de/tailnet-ports: tcp:443
    specht-labs.de/tailnet-allow: group:synology-users
spec:
  type: http
  owner: group:spechtlabs
  system: elbschloss
  lifecycle: production
  definition: |
    https://nas.sphinx-map.ts.net (svc:nas, tcp:443 -> DSM on 5001). Sign-in
    through tsidp (SSO). The o11y collector probes / for the DSM SLO.
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: synology-dsm-https
  title: DSM HTTPS port
  description: DSM's own HTTPS port through svc:nas, which the Synology mobile apps use.
  annotations:
    specht-labs.de/tailnet-dst: svc:nas
    specht-labs.de/tailnet-ports: tcp:5001
    specht-labs.de/tailnet-allow: group:synology-users
spec:
  type: http
  owner: group:spechtlabs
  system: elbschloss
  lifecycle: production
  definition: |
    https://nas.sphinx-map.ts.net:5001 (svc:nas, tcp:5001): DSM itself, as
    the Synology mobile apps reach it.
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: synology-drive
  title: Synology Drive sync
  description: Synology Drive's sync protocol through svc:nas.
  annotations:
    specht-labs.de/tailnet-dst: svc:nas
    specht-labs.de/tailnet-ports: tcp:6690
    specht-labs.de/tailnet-allow: group:synology-users
spec:
  type: tcp
  owner: group:spechtlabs
  system: elbschloss
  lifecycle: production
  definition: |
    nas.sphinx-map.ts.net:6690 (svc:nas, tcp:6690): the Synology Drive
    desktop client's sync.
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: jellyfin
  description: >-
    Jellyfin media server (compose project `media`), on the tailnet as
    https://stream.sphinx-map.ts.net (Tailscale Service svc:stream).
  annotations:
    github.com/project-slug: SpechtLabs/homelab
  links:
    - url: https://stream.sphinx-map.ts.net
      title: Jellyfin
spec:
  type: website
  owner: group:spechtlabs
  system: elbschloss
  lifecycle: production
  providesApis:
    - api:jellyfin-web
  dependsOn:
    - resource:nas
    - resource:tailnet
    - component:synology-dsm
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: jellyfin-web
  title: Jellyfin web
  description: Jellyfin's web UI and HTTP API, behind the Tailscale Service svc:stream.
  annotations:
    # Where tailnet consumers reach it, and who else may. Backstage renders the
    # tailnet policy's grants from these (tailscale/policy/).
    specht-labs.de/tailnet-dst: svc:stream
    specht-labs.de/tailnet-ports: tcp:443
    specht-labs.de/tailnet-allow: group:synology-users
spec:
  type: http
  owner: group:spechtlabs
  system: elbschloss
  lifecycle: production
  definition: |
    Base URL: https://stream.sphinx-map.ts.net (svc:stream, tcp:443)
    Jellyfin's web UI and REST API; the o11y collector probes it for the SLO.
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: obsidian-livesync
  title: Obsidian LiveSync (CouchDB)
  description: >-
    CouchDB for the Obsidian Self-hosted LiveSync plugin (compose project
    `obsidian`), on port 5984 of every interface of the NAS. No Tailscale
    Service: clients reach it on the LAN, admins also on the device address.
  annotations:
    github.com/project-slug: SpechtLabs/homelab
  tags: [couchdb]
spec:
  type: service
  owner: group:spechtlabs
  system: elbschloss
  lifecycle: production
  dependsOn:
    - resource:nas
    - component:synology-dsm
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: github-backup
  title: GitHub backup
  description: >-
    SierraSoftworks/github-backup on the NAS (compose project `backup`):
    every hour, clones cedi's repositories and stars and those of the
    organisations in its config into /volume1/backup/github-backup.
  annotations:
    github.com/project-slug: SpechtLabs/homelab
  links:
    - url: https://github.com/SierraSoftworks/github-backup
      title: github-backup
spec:
  type: service
  owner: group:spechtlabs
  system: elbschloss
  lifecycle: production
  dependsOn:
    - resource:nas
    - component:synology-dsm
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: nas-exporters
  title: NAS exporters
  description: >-
    node-exporter (:9100), snmp-exporter (:9116, Synology MIBs over SNMPv3)
    and cAdvisor (:8123) on the NAS (compose project `o11y`); the o11y
    collector on isa scrapes them: node-exporter through svc:node-exporter,
    the others over the LAN.
  annotations:
    github.com/project-slug: SpechtLabs/homelab
spec:
  type: service
  owner: group:spechtlabs
  system: observability
  lifecycle: production
  providesApis:
    - api:nas-node-exporter
  dependsOn:
    - resource:nas
    - component:synology-dsm
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: nas-node-exporter
  title: NAS node-exporter
  description: The Synology's node-exporter metrics, through the Tailscale Service svc:node-exporter.
  annotations:
    # Where tailnet consumers (the o11y collector) reach it. Backstage renders
    # the tailnet policy's grants from these (tailscale/policy/).
    specht-labs.de/tailnet-dst: svc:node-exporter
    specht-labs.de/tailnet-ports: tcp:9100
spec:
  type: prometheus
  owner: group:spechtlabs
  system: observability
  lifecycle: production
  definition: |
    http://node-exporter.sphinx-map.ts.net:9100/metrics (svc:node-exporter,
    tcp:9100, forwarded by the NAS's tailscaled to its node-exporter). The
    collector keeps instance="nas-elbschloss:9100" on the series.
