version: "3.9"

# Jellyfin only. Nginx Proxy Manager (80/81/443) used to be here too; it was
# gone from the NAS by 2026-11 and Home Assistant is reached through svc:hass,
# so it left the repo as well. Its old data is still in
# /volume1/docker/media/nginx-proxy on the NAS.
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    network_mode: host
    ports:
      - "8096:8096" # HTTP Port
      - "1900:1900" # service auto-discovery
      - "7359:7359" # auto-discovery
    volumes:
      - /volume1/docker/media/jellyfin:/config
      - /volume1/Media:/data/media
