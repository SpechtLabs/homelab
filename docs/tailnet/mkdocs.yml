      - Add a Tailscale Service on a host: how-to/add-a-tailscale-service-on-a-host.md
      - Move a Tailscale Service to another host: how-to/move-a-tailscale-service-to-another-host.md
      - Expose a Kubernetes service on the tailnet: how-to/expose-a-kubernetes-service-on-the-tailnet.md
