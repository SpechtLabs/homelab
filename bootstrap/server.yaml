# /etc/buckle/server.yaml on isa. Installed by hand (fleet docs: "Why the server config is installed by hand"),
# not by Buckle itself: the server shouldn't be able to break its own config.
listen:
  # isa's tailnet address only. WireGuard encrypts; agents are identified
  # by tailscaled's whois, so there is no TLS and no bootstrap token.
  grpc: "${{ env.BUCKLE_LISTEN_ADDR }}:7700"
  http: "${{ env.BUCKLE_LISTEN_ADDR }}:7701"
  tls: { mode: none }
data_dir: /var/lib/buckle-server

source:
  git:
    url: https://github.com/SpechtLabs/homelab.git
    branch: main
    poll: 30s
    # Public repository: no credentials. If it goes private, add a read-only
    # fine-grained PAT:  credentials: { token: "${{ env.GIT_TOKEN }}" }

agents:
  auth: [tailscale]
  registration: auto
  # svc:buckle forwards tcp:7700 here with a PROXY v2 header from the serving host's
  # own address; the server whois-es the agent address the header carries.
  trusted_proxies: ["100.70.89.41"]   # isa (the NUC served it until 2026-11-23)
  tailscale:
    # Agents need one of these tags; a device without one is refused, even when
    # it is already registered (to retag hosts, widen this first).
    allowed_tags: ["tag:buckle-agent"]
    # Uncomment once a Tailscale OAuth client exists (fleet docs: "Enrol a new host"):
    # "Add an agent" then mints a tagged, single-use, pre-approved auth key.
    # provisioning:
    #   flow: client
    #   client_id: "${{ env.TS_OAUTH_CLIENT_ID }}"
    #   client_secret: "${{ env.TS_OAUTH_CLIENT_SECRET }}"
    #   tags: ["tag:buckle-agent"]
  join:
    server_url: http://buckle.sphinx-map.ts.net:7700
  minimum_agent_version: "2.13.0"
  # desired_version defaults to the server's own, which modules/buckle keeps
  # at vars/versions.yaml's buckle_version.

web:
  # Tailscale Service svc:buckle proxies https://buckle.<tailnet> to listen.http
  # (fleet docs, reference: "Server and agents"). tsidp's client for Buckle must list
  # <base_url>/api/v1/auth/callback as a redirect URI.
  base_url: https://buckle.sphinx-map.ts.net
  # Sign-in through tsidp. tsidp adds groups=[buckle-admins] to the tokens of
  # group:admins (tailscale/policy.hujson); nobody else may read or act.
  # tsidp offline? fleet docs: "Sign in when tsidp is down" (break-glass).
  user_acl:  '"buckle-admins" in claims.groups'
  admin_acl: '"buckle-admins" in claims.groups'
  oidc:
    endpoint: https://idp.sphinx-map.ts.net
    client_id: "${{ env.OIDC_CLIENT_ID }}"
    client_secret: "${{ env.OIDC_CLIENT_SECRET }}"
    scopes: [openid, profile, email, offline_access]

secrets:
  providers:
    file: { root: /etc/buckle/secrets }

telemetry:
  otlp_endpoint: http://127.0.0.1:4317     # isa's own Alloy OTLP receiver
