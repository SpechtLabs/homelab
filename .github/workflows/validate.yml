name: validate

# Every check is a mise task (mise.toml): CI only sets up the environment and
# calls it, so `mise run <task>` locally runs exactly what CI runs.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  k3s-one-minor:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
      - name: k3s_version moves at most one minor
        run: mise run check-k3s-minor
        env:
          BASE_REF: origin/${{ github.base_ref }}

  buckle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
      - name: buckle validate
        run: mise run validate
      - name: Install qemu-user (for the emulated x86-64-v2 CPU)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user
      - name: buckle validate on the NUC's CPU (x86-64-v2, no AVX)
        run: mise run validate-x86-64-v2

  # The Markdown and the TechDocs sites under docs/: markdownlint, links, and
  # a strict mkdocs build of every site the way Backstage builds them.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
      - name: mise run docs
        run: mise run docs
