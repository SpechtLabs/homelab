name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  buckle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      # Every host in fixtures/facts gets a dry plan: selectors, templates and
      # task specs are checked against that host's facts.
      - name: buckle validate
        run: |
          args=()
          for f in fixtures/facts/*.json; do args+=(--facts "$f"); done
          mise exec -- buckle validate --config . "${args[@]}"
      # The Buckle server runs on the NUC, an x86-64-v2 CPU without AVX; 2.14.0
      # was built for newer CPUs and crashed it with SIGILL. Run the same
      # validate with the pinned linux-amd64 binary on an emulated Nehalem (the
      # NUC's feature level), so Renovate never automerges a Buckle the server
      # can't run.
      - name: buckle validate on the NUC's CPU (x86-64-v2, no AVX)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user
          args=()
          for f in fixtures/facts/*.json; do args+=(--facts "$f"); done
          qemu-x86_64 -cpu Nehalem "$(mise which buckle)" validate --config . "${args[@]}"
