# Backstage catalog entry for this repo. The Location below pulls in the rest:
# the domain and systems (catalog/systems.yaml), the hardware, Home Assistant,
# the tailnet, the NAS and one catalog-info.yaml per module that runs
# something. Buckle ignores all of them.
#
# How it's modelled (https://backstage.io/docs/features/software-catalog/system-model/):
#  - Domain `homelab`: everything at home or run from this repo. Its sibling
#    domains, specht-labs and third-party, are in SpechtLabs/k8s-deployment.
#  - System: a set of Components and Resources with one job, which offers its
#    APIs to the others: elbschloss (the house), tailnet, fleet (Buckle),
#    timekeeping, ceph, labk3s, compute-blades, jitsi, schiltach; and
#    observability, defined in k8s-deployment. Every entity is in exactly one;
#    a host is in the system it's there for, a general-purpose one in
#    elbschloss. Systems have no relations of their own: what crosses them is
#    an API consumed, or a dependsOn on what something runs on.
#  - Resource: infrastructure something runs on or stores data in (hosts, the
#    NAS, the UPS, networks, the k3s cluster, Ceph's RBD pool).
#  - Component: software that runs (a service, an agent on every host, a site).
#    It dependsOn the Resources it runs on and the Components it can't work
#    without.
#  - API: an interface another Component consumes over the network (OIDC, NUT,
#    NTP, PTP, OTLP, S3, RBD, ...). Providers list it in providesApis, consumers
#    in consumesApis; that is the relation, not a dependsOn on the provider.
#  - Fleet-wide agents (alloy, buckle-agent, nut-client, time-sync) don't list
#    every host they run on: "runs on every Pi" isn't a dependency of the Pi.
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: homelab
  description: Every catalog-info.yaml in SpechtLabs/homelab.
spec:
  targets:
    - ./catalog/systems.yaml
    - ./catalog/hardware.yaml
    - ./catalog/home-assistant.yaml
    - ./tailscale/catalog-info.yaml
    - ./nas/catalog-info.yaml
    - ./modules/*/catalog-info.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: homelab-config
  title: homelab (fleet config)
  description: >-
    This repo: the fleet configuration the Buckle server watches. Every commit
    on main becomes a revision that rolls out through the phases in
    buckle.yaml.
  annotations:
    github.com/project-slug: SpechtLabs/homelab
spec:
  type: gitops
  owner: group:spechtlabs
  system: fleet
  lifecycle: production
