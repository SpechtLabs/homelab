# Auto approvers: the Tailscale Services a host may advertise without
# approval in the admin console. Each Service has one host tag, owned by
# admins only. Never approve a Service for a broad tag: the k8s operators'
# proxies carry such tags too.
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: approve-nas
  title: The NAS serves svc:nas, svc:stream, svc:nas-exporter and svc:nas-nfs
  description: >-
    Jellyfin (`tailscale serve --service=svc:stream --https=443
    http://localhost:8096`), DSM, Drive and SMB (nas/README.md), the
    node_exporter (tcp:9100) and NFS v4.1 (tcp:2049).
spec:
  type: autoApprovers
  target: tailscale:sphinx-map
  owner: group:spechtlabs
  system: tailnet
  appliesTo: [resource:nas]
  services:
    svc:stream: [tag:nas]
    svc:nas: [tag:nas]
    svc:nas-exporter: [tag:nas]
    svc:nas-nfs: [tag:nas]
---
