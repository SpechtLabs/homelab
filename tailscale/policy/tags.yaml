  title: tsidp relying parties
  description: >-
    Machines that call tsidp's token, JWKS and userinfo endpoints over the
    tailnet: isa (the Buckle server), the NAS (DSM's SSO) and labk3s's
    k3s-idp-egress (its Argo CD). Every consumesApis: api:tsidp-oidc
    across the catalogs is one; the NAS lost DSM sign-in on 2026-11-25 when
    a retag dropped this tag.
spec:
  type: tag
  target: tailscale:sphinx-map
  owner: group:spechtlabs
  system: tailnet
  tag: tag:tsidp-client
  owners: [group:admins, tag:k8s-operator, tag:k3s-operator]
  appliesTo: [resource:isa, resource:nas, component:tailscale-labk3s]
