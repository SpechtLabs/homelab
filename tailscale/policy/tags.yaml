# Tags: tagOwners in the policy file. A tag says what a device is or does.
# spec.appliesTo names what carries it, so its catalog page shows the
# tailnet access that comes with it. Service hosts (tag:nas, tag:nut-server,
# tag:k3s-server, tag:buckle-server, tag:hass-server) are owned by admins
# only: a Service's only auto approver, which neither k8s operator can hand
# to a proxy.
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: tag-tsidp
  title: tsidp, the tailnet's OIDC provider
  description: Allowed to run tsidp with Tailscale Funnel.
spec:
  type: tag
  target: tailscale:sphinx-map
  owner: group:spechtlabs
  system: tailnet
  tag: tag:tsidp
  owners: [group:admins]
  appliesTo: [component:tsidp]
---
