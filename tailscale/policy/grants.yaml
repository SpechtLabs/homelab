# Grants that the services' annotations can't express: the admins'
# break-glass access to everything, exit nodes, and grants that carry
# application capabilities (the tailscaled web UI, TKA, tsidp's claims), whose
# values don't fit an annotation; and the collector's scrapes, whose
# destination is every device rather than a service.
#
# Everything else comes from the catalog (the policy's catalogGrants): an
# API's specht-labs.de/tailnet-dst and -ports say where it is reached, every
# Component consuming it across the tailnet reaches it as its tailnet-src (or
# the API's tailnet-client-tag), and its tailnet-allow names who else may use
# it, people included. Add a grant here only when it can't be said there.
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-admins-everything
  title: Admins reach everything
spec:
  type: grant
  target: tailscale:sphinx-map
  owner: group:spechtlabs
  system: tailnet
  src: [group:admins]
  dst: ['*']
  ip: ['*']
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-vpn-exit-nodes
  title: VPN users use the exit nodes
spec:
  type: grant
  target: tailscale:sphinx-map
  owner: group:spechtlabs
  system: tailnet
  src: [group:vpn]
  dst: [autogroup:internet]
  ip: ['*']
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-webui-admins
  title: Admins edit everything in the smart-home devices' web UI
spec:
  type: grant
  target: tailscale:sphinx-map
  owner: group:spechtlabs
  system: tailnet
  src: [group:admins]
  dst: [tag:smarthome]
  ip: ['5252']
  app:
    tailscale.com/cap/webui:
      - canEdit: ['*']
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-webui-self
  title: Members manage their own devices in the web UI
  description: >-
    Account, SSH and exit node settings; not subnet routers.
spec:
  type: grant
  target: tailscale:sphinx-map
  owner: group:spechtlabs
  system: tailnet
  src: [autogroup:member]
  dst: [autogroup:self]
  ip: ['5252']
  app:
    tailscale.com/cap/webui:
      - canEdit: [account, ssh, exitNodes]
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-tka-admins
  title: Admins get cluster-admin through TKA
  description: >-
    group:admins sign in to both clusters through TKA as cluster-admin, for
    an hour at a time.
spec:
  type: grant
  target: tailscale:sphinx-map
  owner: group:spechtlabs
  system: tailnet
  appliesTo: [component:tka, component:tka-labk3s]
  src: [group:admins]
  dst: [tag:tka]
  ip: ['*']
  app:
    specht-labs.de/cap/tka:
      - role: cluster-admin
        period: 1h
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-o11y-scrape
  title: The collector scrapes every exporter
  description: >-
    node-exporter 9100, rpi-exporter 9243, snmp-exporter 9116, cadvisor 8123,
    tailscale-exporter 5252, compute-blade-agent 9666.
spec:
  type: grant
  target: tailscale:sphinx-map
  owner: group:spechtlabs
  system: tailnet
  appliesTo: [component:o11y-collector]
  src: [tag:o11y-collector]
  dst: ['*']
  ip: ['9100', '9243', '9116', '8123', '5252', '9666']
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-tsidp-admins
  title: Admins manage tsidp and administer Buckle
  description: >-
    group:admins use tsidp's admin UI and register OIDC clients. Their tokens
    carry groups ["buckle-admins"], which Buckle's admin_acl checks: who
    administers the fleet is decided here.
spec:
  type: grant
  target: tailscale:sphinx-map
  owner: group:spechtlabs
  system: tailnet
  appliesTo: [component:tsidp, component:buckle-server]
  src: [group:admins]
  dst: [tag:tsidp]
  ip: ['*']
  app:
    tailscale.com/cap/tsidp:
      - allow_admin_ui: true
        allow_dcr: true
        extraClaims:
          groups: [buckle-admins]
        includeInUserInfo: true
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-tsidp-grafana-admins
  title: Admins are Grafana admins
  description: >-
    group:admins get groups ["grafana-admins"] in their tsidp tokens; Grafana
    maps it to its Admin role. tsidp unions list claims across grants, so
    their tokens carry ["buckle-admins", "grafana-admins"].
spec:
  type: grant
  target: tailscale:sphinx-map
  owner: group:spechtlabs
  system: tailnet
  appliesTo: [component:tsidp]
  src: [group:admins]
  dst: [tag:tsidp]
  ip: ['*']
  app:
    tailscale.com/cap/tsidp:
      - extraClaims:
          groups: [grafana-admins]
        includeInUserInfo: true
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-tsidp-synology
  title: Synology users sign in to the NAS through tsidp
spec:
  type: grant
  target: tailscale:sphinx-map
  owner: group:spechtlabs
  system: tailnet
  appliesTo: [component:tsidp, component:synology-dsm]
  src: [group:synology-users]
  dst: [tag:tsidp]
  ip: ['*']
  app:
    tailscale.com/cap/tsidp:
      - users: [group:synology-users]
        resources: [synology]
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-tsidp-argocd-sre
  title: SREs sign in to Argo CD through tsidp
spec:
  type: grant
  target: tailscale:sphinx-map
  owner: group:spechtlabs
  system: tailnet
  appliesTo: [component:tsidp, component:argocd, component:argocd-labk3s]
  src: [group:sre]
  dst: [tag:tsidp]
  ip: ['*']
  app:
    tailscale.com/cap/tsidp:
      - users: [group:sre]
        resources: [argocd]
