# Grants: who may reach what, and with which capabilities. Sources are
# attributes (a group, or a tag that says what a device does), destinations
# Tailscale Services where they can be: a Service maps its ports to whichever
# host serves it, so the host can move without touching a grant.
#
# Service-to-service traffic isn't here: Backstage renders a grant for every
# Component that consumes an API across the tailnet (the policy's
# catalogGrants, from the specht-labs.de/tailnet-* annotations). These are
# the rest: people, capabilities, and what is no API.
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-admins-everything
  title: Admins reach everything
spec:
  type: grant
  target: tailscale:sphinx-map
  src: [group:admins]
  dst: ['*']
  ip: ['*']
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-admins-specht-labs-uis
  title: Admins use Argo CD and Backstage on specht-labs
  description: >-
    argocd.k8s.specht-labs.de and backstage.k8s.specht-labs.de; the admins'
    "*" grant covers them too.
spec:
  type: grant
  target: tailscale:sphinx-map
  appliesTo: [component:argocd, component:backstage]
  src: [group:admins]
  dst: [svc:argocd, svc:backstage]
  ip: [tcp:443]
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-vpn-exit-nodes
  title: VPN users use the exit nodes
spec:
  type: grant
  target: tailscale:sphinx-map
  src: [group:vpn]
  dst: [autogroup:internet]
  ip: ['*']
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-webui-admins
  title: Admins edit everything in the smart-home devices' web UI
spec:
  type: grant
  target: tailscale:sphinx-map
  src: [group:admins]
  dst: [tag:smarthome]
  ip: ['5252']
  app:
    tailscale.com/cap/webui:
      - canEdit: ['*']
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-webui-self
  title: Members manage their own devices in the web UI
  description: >-
    Account, SSH and exit node settings; not subnet routers.
spec:
  type: grant
  target: tailscale:sphinx-map
  src: [autogroup:member]
  dst: [autogroup:self]
  ip: ['5252']
  app:
    tailscale.com/cap/webui:
      - canEdit: [account, ssh, exitNodes]
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-tka-admins
  title: Admins get cluster-admin through TKA
  description: >-
    group:admins sign in to both clusters through TKA as cluster-admin, for
    an hour at a time.
spec:
  type: grant
  target: tailscale:sphinx-map
  appliesTo: [component:tka, component:tka-labk3s]
  src: [group:admins]
  dst: [tag:tka]
  ip: ['*']
  app:
    specht-labs.de/cap/tka:
      - role: cluster-admin
        period: 1h
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-lab-argocd
  title: Admins and SREs use the labk3s Argo CD
  description: >-
    https://lab-argocd.<tailnet> (svc:lab-argocd); sign-in through tsidp.
spec:
  type: grant
  target: tailscale:sphinx-map
  appliesTo: [component:argocd-labk3s]
  src: [group:admins, group:sre]
  dst: [svc:lab-argocd]
  ip: [tcp:443]
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-o11y-scrape
  title: The collector scrapes every exporter
  description: >-
    node-exporter 9100, rpi-exporter 9243, snmp-exporter 9116, cadvisor 8123,
    tailscale-exporter 5252, compute-blade-agent 9666.
spec:
  type: grant
  target: tailscale:sphinx-map
  appliesTo: [component:o11y-collector]
  src: [tag:o11y-collector]
  dst: ['*']
  ip: ['9100', '9243', '9116', '8123', '5252', '9666']
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-admins-labk3s-api
  title: Admins run kubectl against labk3s
  description: >-
    https://labk3s.<tailnet>:6443. The Service has only tcp:6443.
spec:
  type: grant
  target: tailscale:sphinx-map
  appliesTo: [component:k3s-server]
  src: [group:admins]
  dst: [svc:labk3s]
  ip: ['*']
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-synology-nas
  title: Synology users reach DSM and Drive
  description: >-
    Through svc:nas (https://nas.<tailnet>), and nothing else on the NAS.
    The NAS's Service address passes every port through, so this lists
    them: DSM 443, DSM HTTPS for the mobile apps 5001, Drive sync 6690.
spec:
  type: grant
  target: tailscale:sphinx-map
  appliesTo: [component:synology-dsm]
  src: [group:synology-users]
  dst: [svc:nas]
  ip: [tcp:443, tcp:5001, tcp:6690]
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-synology-stream
  title: Synology users stream from Jellyfin
  description: https://stream.<tailnet>
spec:
  type: grant
  target: tailscale:sphinx-map
  appliesTo: [component:jellyfin]
  src: [group:synology-users]
  dst: [svc:stream]
  ip: [tcp:443]
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-hass-users
  title: Home Assistant users reach Home Assistant at home
  description: >-
    https://hass.<tailnet> and http://hass.<tailnet>:8123. The Service has
    only the web UI's ports, so "*" is all it offers.
spec:
  type: grant
  target: tailscale:sphinx-map
  appliesTo: [component:home-assistant]
  src: [group:hass-users]
  dst: [svc:hass]
  ip: ['*']
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-tsidp-sign-in
  title: Everyone signs in through tsidp
  description: >-
    https://idp.<tailnet>: every member, the relying parties
    (tag:tsidp-client) and the collector's probe. tsidp stays a device, not
    a Service: it relies on Funnel and on capability grants matched on its
    own address. The grants below add capabilities per group.
spec:
  type: grant
  target: tailscale:sphinx-map
  appliesTo: [component:tsidp]
  src: [autogroup:member, tag:tsidp-client, tag:o11y-collector]
  dst: [tag:tsidp]
  ip: [tcp:443]
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-tsidp-admins
  title: Admins manage tsidp and administer Buckle
  description: >-
    group:admins use tsidp's admin UI and register OIDC clients. Their tokens
    carry groups ["buckle-admins"], which Buckle's admin_acl checks: who
    administers the fleet is decided here.
spec:
  type: grant
  target: tailscale:sphinx-map
  appliesTo: [component:tsidp, component:buckle-server]
  src: [group:admins]
  dst: [tag:tsidp]
  ip: ['*']
  app:
    tailscale.com/cap/tsidp:
      - allow_admin_ui: true
        allow_dcr: true
        extraClaims:
          groups: [buckle-admins]
        includeInUserInfo: true
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-tsidp-grafana-admins
  title: Admins are Grafana admins
  description: >-
    group:admins get groups ["grafana-admins"] in their tsidp tokens; Grafana
    maps it to its Admin role. tsidp unions list claims across grants, so
    their tokens carry ["buckle-admins", "grafana-admins"].
spec:
  type: grant
  target: tailscale:sphinx-map
  appliesTo: [component:tsidp]
  src: [group:admins]
  dst: [tag:tsidp]
  ip: ['*']
  app:
    tailscale.com/cap/tsidp:
      - extraClaims:
          groups: [grafana-admins]
        includeInUserInfo: true
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-tsidp-synology
  title: Synology users sign in to the NAS through tsidp
spec:
  type: grant
  target: tailscale:sphinx-map
  appliesTo: [component:tsidp, component:synology-dsm]
  src: [group:synology-users]
  dst: [tag:tsidp]
  ip: ['*']
  app:
    tailscale.com/cap/tsidp:
      - users: [group:synology-users]
        resources: [synology]
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-tsidp-argocd-sre
  title: SREs sign in to Argo CD through tsidp
spec:
  type: grant
  target: tailscale:sphinx-map
  appliesTo: [component:tsidp, component:argocd, component:argocd-labk3s]
  src: [group:sre]
  dst: [tag:tsidp]
  ip: ['*']
  app:
    tailscale.com/cap/tsidp:
      - users: [group:sre]
        resources: [argocd]
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: grant-buckle-ui
  title: Admins and SREs use Buckle
  description: >-
    The UI and API at https://buckle.<tailnet>. Signing in still needs the
    buckle-admins claim (server.yaml's user_acl).
spec:
  type: grant
  target: tailscale:sphinx-map
  appliesTo: [component:buckle-server]
  src: [group:admins, group:sre]
  dst: [svc:buckle]
  ip: [tcp:443]
