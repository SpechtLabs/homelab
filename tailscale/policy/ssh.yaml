  target: tailscale:sphinx-map
  owner: group:spechtlabs
  system: tailnet
  action: accept
  src: [group:sre]
  dst: [tag:ceph, tag:compute-blade, tag:k3s-node]
  users: [autogroup:nonroot]
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: ssh-sre-infra-root
  title: SREs are root on Ceph, the compute blades and labk3s in check mode
spec:
  type: ssh
  target: tailscale:sphinx-map
  owner: group:spechtlabs
  system: tailnet
  action: check
  checkPeriod: 8h
  src: [group:sre]
  dst: [tag:ceph, tag:compute-blade, tag:k3s-node]
  users: [root]
---
apiVersion: specht-labs.de/v1alpha1
kind: Tailscale
metadata:
  name: ssh-members-own-devices
