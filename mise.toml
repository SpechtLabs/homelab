[tools]
"github:SierraSoftworks/buckle" = "2.17.0"
"github:compute-blade-community/compute-blade-agent" = "0.11.5"
yq = "4.54.3"

[tasks.validate]
description = "Validate the config and dry-plan every host in fixtures/facts"
run = "buckle validate --config . $(printf -- '--facts %s ' fixtures/facts/*.json)"

[tasks.bladectl-config]
description = "Find the blades via mDNS and fetch each one's bladectl client config (mTLS) into ~/.config/bladectl/config.yaml"
run = '''
#!/usr/bin/env bash
set -euo pipefail
dir="$HOME/.config/bladectl"; mkdir -p "$dir"; chmod 700 "$dir"
tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
# The agents announce themselves via mDNS (modules/compute-blade-agent), which
# only works on the blades' LAN. Away from it, keep the blades already configured.
blades=$(bladectl discover --wait 3s 2>/dev/null | awk -F'│' 'NF>6 && $2 !~ /BLADE/ {gsub(/ /,"",$2); print $2}')
if [ -z "$blades" ] && [ -f "$dir/config.yaml" ]; then
  echo "no blades announced here (not on their LAN?); refreshing the configured ones"
  blades=$(yq '.blades[].name' "$dir/config.yaml")
fi
[ -n "$blades" ] || { echo "no blades found" >&2; exit 1; }
# Discovery carries no secrets: the client certificates come over SSH. The
# server is the bare host name, which resolves on the LAN and over the tailnet.
for b in $blades; do
  # root's config, written by the agent (modules/compute-blade-agent)
  mkdir -p "$tmp/blades"
  ssh -o BatchMode=yes "pi@$b" sudo cat /root/.config/bladectl/config.yaml > "$tmp/blades/$b.yaml"
  yq -i ".blades[0].name = \"$b\" | .blades[0].blade.server = \"$b:8081\"" "$tmp/blades/$b.yaml"
done
first=$(echo "$blades" | head -1)
yq ea ". as \$b ireduce ({}; .blades += \$b.blades) | .[\"current-blade\"] = \"$first\"" "$tmp"/blades/*.yaml > "$tmp/config.yaml"
install -m 0600 "$tmp/config.yaml" "$dir/config.yaml"
echo "wrote $dir/config.yaml: $(yq '.blades[].name' "$dir/config.yaml" | paste -sd' ' -)"
# Every blade should show as configured; on the LAN, --save also fixes an
# address that no longer reaches its blade.
bladectl discover --save || true
echo "try: bladectl -A get fan; bladectl -A events"
'''
