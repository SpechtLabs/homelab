# Backstage: the hardware and the home network. One Resource per host Buckle
# manages (its id is the tailnet node name), plus what they hang off. What runs
# on a host is a Component in modules/*/catalog-info.yaml that dependsOn it.
# Referenced from the Location in the repo-root catalog-info.yaml.

# Networks and power
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: home-lan
  title: Home LAN
  description: >-
    192.168.0.0/24. Carries what must not wait for Tailscale: NTP and PTP from
    timepi, and the UPS's NUT server.
spec:
  type: network
  owner: group:spechtlabs
  system: elbschloss
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ups
  title: UPS Tower
  description: >-
    Ubiquiti UPS Tower (UPSTower.local, 192.168.0.154). Serves NUT itself (UPS
    name `ups`); isa re-exports it to the fleet (nut-server).
  tags: [power]
spec:
  type: ups
  owner: group:spechtlabs
  system: elbschloss
  dependsOn:
    - resource:home-lan
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: gps-receiver
  title: timepi GPS/PPS receiver
  description: >-
    u-blox M8 on timepi's HAT (UART + PPS GPIO). PPS only while it has a fix,
    which the antenna's poor sky view loses several times a day.
  tags: [time, hardware]
spec:
  type: gps-receiver
  owner: group:spechtlabs
  system: timekeeping
  dependsOn:
    - resource:timepi
---
# Hosts at home: x86
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: isa
  description: >-
    HP EliteDesk 800 G6 Mini (i5-10500), Ubuntu 26.04. Took over from the NUC
    on 2026-11-23: Buckle server, tsidp, NUT proxy, o11y collector.
  tags: [x86-64, ubuntu, core]
spec:
  type: host
  owner: group:spechtlabs
  system: elbschloss
  dependsOn:
    - resource:home-lan
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: nuc
  description: >-
    GIGABYTE mini PC (Celeron), Ubuntu 24.10, end of life (apt points at
    old-releases by hand). A plain host since isa replaced it; still runs
    Incus, unmanaged.
  tags: [x86-64, ubuntu, core]
spec:
  type: host
  owner: group:spechtlabs
  system: elbschloss
  dependsOn:
    - resource:home-lan
---
