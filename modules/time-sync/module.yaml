name: time-sync
description: chrony on every Pi, the NUC and isa follows timepi; by PTP with hardware timestamps (ptp4l) where the NIC can (ptp-facts; the Pi 5s, the CM4 blades and isa), the rest by NTP. The public pool is the fallback.
when: 'host.groups contains "ntp-client"'
needs: [alloy, ptp-facts]    # the textfile directory time-client-metrics writes to; the NIC PTP runs on
tags: [time]
tasks:
  # chrony replaces systemd-timesyncd: an SNTP client polling every 34 min
  # that kept the Pis 100-700 us off timepi. Both provide time-daemon, so apt
  # removes timesyncd when chrony comes in.
  - apt.package: { name: chrony }
  - file.template: { src: chrony.conf.j2, dest: /etc/chrony/chrony.conf, mode: "0644" }
    notify: [restart-chrony]
  - systemd.unit: { name: chrony, enabled: true, active: true }

  # ── PTP (ptp-client group, buckle.yaml) ──
  # ptp4l keeps the NIC's hardware clock on timepi's grandmaster; chrony reads
  # it (refclock PHC). No phc2sys: chrony owns the system clock. The NIC and
  # its clock come from host.facts.script.ptp (modules/ptp-facts): eth0 and
  # ptp0 on the Pis, eno1 on isa.
  - apt.package: { name: linuxptp }
    when: 'host.groups contains "ptp-client"'
  - file.template: { src: ptp4l-client.conf.j2, dest: /etc/linuxptp/ptp4l.conf, mode: "0644" }
    when: 'host.groups contains "ptp-client"'
    notify: [restart-ptp4l]
  # Where AppArmor enforces (Ubuntu: isa), linuxptp's profile lacks a rule for
  # pmc's reply socket; the profile's local include takes it. Reloading
  # applies it to the running ptp4l.
  - file.copy: { src: apparmor-ptp4l.local, dest: /etc/apparmor.d/local/usr.sbin.ptp4l, mode: "0644" }
    id: ptp4l-apparmor
    when: 'host.groups contains "ptp-client" && host.facts.systemd.active contains "apparmor.service"'
    notify: [reload-ptp4l-apparmor]
  # The NIC's hardware clock appears only once the link is up; a ptp4l started
  # earlier stays FAULTY for good (as on timepi, modules/ptp-server).
  - systemd.dropin:
      unit: 'ptp4l@{{ host.facts.script.ptp.interface }}.service'
      content: |
        [Unit]
        Wants=network-online.target
        After=network-online.target

        [Service]
        ExecStartPre=/bin/sh -c 'until [ "$$(cat /sys/class/net/%i/operstate)" = up ]; do sleep 1; done'
        TimeoutStartSec=120
        Restart=on-failure
        RestartSec=5s
    id: ptp4l-dropin
    when: 'host.groups contains "ptp-client"'
    notify: [restart-ptp4l]
  - systemd.unit: { name: 'ptp4l@{{ host.facts.script.ptp.interface }}', enabled: true, active: true }
    id: ptp4l-service
    when: 'host.groups contains "ptp-client"'

  # ptp4l steps the NIC's hardware clock from boot time to TAI once it locks. A
  # chrony reading the PHC meanwhile can keep a wild error estimate for that
  # source and never select it (blade-pi4, 2026-11-19: on NTP for 40 min with
  # ptp4l locked at 130 ns). So chrony starts once ptp4l is SLAVE (90 s at
  # most: NTP must not wait on a broken PTP), ...
  - systemd.dropin:
      unit: chrony.service
      name: ptp.conf
      content: |
        [Unit]
        After=ptp4l@{{ host.facts.script.ptp.interface }}.service

        [Service]
        ExecStartPre=-/bin/sh -c 'for i in $$(seq 90); do pmc -u -b 0 "GET PORT_DATA_SET" 2>/dev/null | grep -q "portState.*SLAVE" && exit 0; sleep 1; done'
        TimeoutStartSec=150
    id: chrony-after-ptp4l
    when: 'host.groups contains "ptp-client"'
    notify: [restart-chrony]
  # ... and if it still isn't following PTP while ptp4l is locked, the next
  # run restarts it.
  - command.run:
      run: [systemctl, restart, chrony]
      only_if: >-
        pmc -u -b 0 'GET PORT_DATA_SET' 2>/dev/null | grep -q 'portState.*SLAVE' &&
        ! chronyc -n sources | grep -q '^#\* PTP'
    id: chrony-follow-ptp
    when: 'host.groups contains "ptp-client"'
    removal: leave

  # ── Metrics ──
  # chrony's tracking (offset, rms, frequency, error bounds, source) and
  # ptp4l's offset and path delay to timepi, every 30 s, for node_exporter's
  # textfile collector: how close each host really is, on the Stratum 1
  # dashboard. Read-only queries.
  - file.copy: { src: time-client-metrics, dest: /usr/local/sbin/time-client-metrics, mode: "0755" }
    when: 'vars.o11y_textfile_dir != ""'
  - file.template:
      src: time-client-metrics.service.j2
      dest: /etc/systemd/system/time-client-metrics.service
      mode: "0644"
    when: 'vars.o11y_textfile_dir != ""'
    notify: [daemon-reload]
  - file.copy: { src: time-client-metrics.timer, dest: /etc/systemd/system/time-client-metrics.timer, mode: "0644" }
    when: 'vars.o11y_textfile_dir != ""'
    notify: [daemon-reload]
  - systemd.unit: { name: time-client-metrics.timer, enabled: true, active: true, daemon_reload: true }
    when: 'vars.o11y_textfile_dir != ""'

  # A changed unit or drop-in that systemd hasn't loaded: systemd.unit doesn't
  # reload while the unit stays enabled and active, and a restart alone would
  # run the old one.
  - command.run:
      run: [sh, -c, 'systemctl daemon-reload && systemctl restart ptp4l@{{ host.facts.script.ptp.interface }}']
      only_if: 'test "$(systemctl show -p NeedDaemonReload --value ptp4l@{{ host.facts.script.ptp.interface }})" = yes'
    id: ptp4l-stale-unit
    when: 'host.groups contains "ptp-client"'
    removal: leave

handlers:
  daemon-reload: { systemd.daemon_reload: {} }
  restart-chrony: { command.run: { run: [sh, -c, 'systemctl daemon-reload && systemctl restart chrony'] } }
  # chrony restarts behind ptp4l: its drop-in waits for SLAVE (chrony-after-ptp4l).
  reload-ptp4l-apparmor: { command.run: { run: [sh, -c, 'test ! -e /etc/apparmor.d/usr.sbin.ptp4l || apparmor_parser -r /etc/apparmor.d/usr.sbin.ptp4l'] } }
  restart-ptp4l: { command.run: { run: [sh, -c, 'systemctl daemon-reload && systemctl restart ptp4l@{{ host.facts.script.ptp.interface }} && systemctl restart chrony'] } }

health:
  # chrony reports Leap status Normal once it follows a source.
  - name: synchronized
    command:
      run: [chronyc, -n, tracking]
      expect: { stdout_matches: 'Leap status\s+: Normal' }
  # Informational: a host on the pool (timepi down) or on NTP (PTP not locked
  # yet) still keeps time and mustn't stop every rollout.
  - name: source
    command:
      run: [chronyc, -n, sources]
      expect: { stdout_matches: '{{ "(?m)^#\* PTP" if "ptp-client" in host.groups else "(?m)^\^\* " ~ vars.ntp_server }}' }
    required: false
