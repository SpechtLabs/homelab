# Backstage catalog entry for the time clients. Not read by Buckle: Backstage
# reads it through the Location in the repo-root catalog-info.yaml.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: time-sync
  title: Time sync (chrony, ptp4l)
  description: >-
    chrony on every Pi, the NUC and isa, following timepi. By PTP with
    hardware timestamps (ptp4l; median offset 11-25 ns) where the NIC can
    (ptp-facts: the Pi 5s, the CM4 blades and isa), the rest by NTP (median
    0.2-0.3 us, 95% under 2.6 us); the public pool as fallback. Offsets are
    chrony's |system offset| over the 7 days to 2026-11-26.
  annotations:
    github.com/project-slug: SpechtLabs/homelab
spec:
  type: service
  owner: group:spechtlabs
  system: timekeeping
  lifecycle: production
  consumesApis:
    - api:ntp
    - api:ptp
  dependsOn:
    - resource:home-lan
