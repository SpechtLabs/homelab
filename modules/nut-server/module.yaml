name: nut-server
description: upsd on the NUC, re-exporting the UPS Tower's NUT server (dummy-ups proxy) to the Pis.
when: 'host.groups contains "nut-server"'
tags: [power]
vars:
  # The Ubiquiti UPS Tower (UPSTower.local) serves NUT itself, UPS name `ups`.
  # Keep its DHCP lease fixed. It accepts any login, so monuser and the
  # stored NUT_UPSTREAM_PASSWORD (DSM's old fixed account) still work.
  # (Not the Synology on .64: it has no NUT server enabled.)
  nut_upstream_host: 192.168.0.156
  nut_upstream_user: monuser
  nut_admin_user: admin
  nut_monitor_user: monuser
  nut_listen: 0.0.0.0
  nut_finaldelay: 180
tasks:
  - apt.package: { name: nut }

  - file.template: { src: nut.conf.j2, dest: /etc/nut/nut.conf, mode: "0640", owner: root, group: nut }
    notify: [restart-server, restart-monitor]
  - file.template: { src: ups.conf.j2, dest: /etc/nut/ups.conf, mode: "0640", owner: root, group: nut }
    notify: [restart-server]
  - file.template: { src: upsd.conf.j2, dest: /etc/nut/upsd.conf, mode: "0640", owner: root, group: nut }
    notify: [restart-server]
  - file.template: { src: upsd.users.j2, dest: /etc/nut/upsd.users, mode: "0640", owner: root, group: nut }
    notify: [restart-server]
  - file.template: { src: upsmon.conf.j2, dest: /etc/nut/upsmon.conf, mode: "0640", owner: root, group: nut }
    notify: [restart-monitor]

  - systemd.unit: { name: nut-server, enabled: true, active: true }
  - systemd.unit: { name: nut-monitor, enabled: true, active: true }

handlers:
  restart-server:  { systemd.restart: { name: nut-server } }
  restart-monitor: { systemd.restart: { name: nut-monitor } }

health:
  - name: upsd
    tcp: { address: '127.0.0.1:3493' }
  # The UPS Tower reached through this proxy: the whole fleet's power-loss
  # shutdown depends on it.
  - name: proxied-ups
    command:
      run: ['upsc', '{{ vars.nut_ups_name }}@localhost', 'ups.status']
      expect: { exit: 0 }
