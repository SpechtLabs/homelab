name: ptp-server
description: GPS-disciplined time server. gpsd + PPS feed ntpsec (NTP); ptp4l and phc2sys serve PTP once ptp_enabled; time-metrics exports all of it.
when: 'host.groups contains "ptp-grandmaster"'
needs: [pi-firmware, alloy]  # config.txt: the PPS overlay and UART; alloy: the textfile directory
tags: [time]
vars:
  ptp_gps_device: /dev/ttyAMA0
  ptp_pps_device: /dev/pps0
  # No -s: gpsd detects the speed. The receiver talks NMEA at 9600 baud; the
  # `-s 115200` timepi had by hand made gpsd read noise, so there was no GPS
  # time to number the PPS seconds with.
  ptp_gpsd_options: "-n"
  ptp_gpsd_usbauto: "false"
  # fudge time1 for the (never selected) NMEA refclock, in seconds: roughly how
  # late NMEA arrives after the PPS edge; 150-600 ms on timepi at 9600 baud.
  ntp_gps_offset: "0.600"
  # PTP grandmaster: GPS+PPS discipline the system clock (ntpsec), phc2sys
  # copies it to eth0's hardware clock, ptp4l serves that. Needs a kernel past
  # 6.12.34 (whose PHCs refuse every adjustment: "physical clock is free
  # running") and `hwts_filter full` (ptp4l.conf) on the Pi 5's Ethernet.
  ptp_enabled: true
  ptp_interface: eth0
tasks:
  # ntpsec is what runs (chrony conflicts with it and was never installed).
  # gpsd reads the NMEA and /dev/pps0 and hands ntpsec the PPS edges, numbered
  # by the NMEA second, through shared memory (unit 1).
  - apt.package:
      names: [ntpsec, pps-tools, gpsd, gpsd-clients]

  - file.template: { src: gpsd.j2, dest: /etc/default/gpsd, mode: "0644" }
    notify: [restart-gpsd]
  - file.template: { src: ntp.conf.j2, dest: /etc/ntpsec/ntp.conf, mode: "0644" }
    notify: [restart-ntpsec]

  - systemd.unit: { name: gpsd, enabled: true, active: true }
  - systemd.unit: { name: ntpsec, enabled: true, active: true }

  # ── PTP (opt-in) ──
  - apt.package: { name: linuxptp }
    when: 'vars.ptp_enabled == true'
  - file.copy: { src: ptp4l.conf, dest: /etc/linuxptp/ptp4l.conf, mode: "0644" }
    when: 'vars.ptp_enabled == true'
    notify: [restart-ptp4l]
  - file.template:
      src: phc2sys.service.j2
      dest: '/etc/systemd/system/phc2sys-{{ vars.ptp_interface }}.service'
      mode: "0644"
    id: phc2sys-unit
    when: 'vars.ptp_enabled == true'
    notify: [restart-phc2sys]
  # The Ansible role wrote this unit under /lib, where package files belong.
  - file.absent: { path: '/lib/systemd/system/phc2sys-{{ vars.ptp_interface }}.service' }
    id: phc2sys-legacy-unit
    when: 'vars.ptp_enabled == true'
    removal: leave
  # eth0's hardware clock appears only once the interface is up, seconds after
  # the unit would start. A ptp4l started earlier stays FAULTY for good
  # (fault_reset_interval doesn't recover it), so wait for the link first.
  # phc2sys is ordered after ptp4l, so it waits too.
  - systemd.dropin:
      unit: 'ptp4l@{{ vars.ptp_interface }}.service'
      content: |
        [Unit]
        Wants=network-online.target
        After=network-online.target

        [Service]
        ExecStartPre=/bin/sh -c 'until [ "$$(cat /sys/class/net/%i/operstate)" = up ]; do sleep 1; done'
        TimeoutStartSec=120
        Restart=on-failure
        RestartSec=5s
    id: ptp4l-dropin
    when: 'vars.ptp_enabled == true'
    notify: [restart-ptp4l]
  - systemd.unit: { name: 'ptp4l@{{ vars.ptp_interface }}', enabled: true, active: true }
    id: ptp4l-service
    when: 'vars.ptp_enabled == true'
  - systemd.unit: { name: 'phc2sys-{{ vars.ptp_interface }}', enabled: true, active: true, daemon_reload: true }
    id: phc2sys-service
    when: 'vars.ptp_enabled == true'

  # ── Metrics ──
  # None of the daemons exports Prometheus metrics, so a timer reads them
  # (ntpq's control protocol, gpsd's JSON, sysfs, pmc, phc2sys's journal) into
  # node_exporter textfiles every 30 s. Read-only: nothing here restarts or
  # reconfigures a time daemon. Off unless the host has a textfile directory.
  - file.copy: { src: time-metrics.py, dest: /usr/local/sbin/time-metrics, mode: "0755" }
    when: 'vars.o11y_textfile_dir != ""'
  - file.template:
      src: time-metrics.service.j2
      dest: /etc/systemd/system/time-metrics.service
      mode: "0644"
    when: 'vars.o11y_textfile_dir != ""'
    notify: [daemon-reload]
  - file.copy: { src: time-metrics.timer, dest: /etc/systemd/system/time-metrics.timer, mode: "0644" }
    when: 'vars.o11y_textfile_dir != ""'
    notify: [daemon-reload]
  - systemd.unit: { name: time-metrics.timer, enabled: true, active: true, daemon_reload: true }
    when: 'vars.o11y_textfile_dir != ""'

handlers:
  daemon-reload:   { systemd.daemon_reload: {} }
  restart-gpsd:    { systemd.restart: { name: gpsd } }
  restart-ntpsec:  { systemd.restart: { name: ntpsec } }
  restart-ptp4l:   { systemd.restart: { name: 'ptp4l@{{ vars.ptp_interface }}' } }
  restart-phc2sys: { systemd.restart: { name: 'phc2sys-{{ vars.ptp_interface }}' } }

health:
  - name: gpsd
    systemd: { unit: gpsd, state: active }
  - name: ntpsec
    systemd: { unit: ntpsec, state: active, min_uptime: 30s }
  - name: ntp-synced
    command:
      run: [ntpq, -pn]
      expect: { stdout_matches: '(?m)^\*' }      # some source is selected
  # GPS: gpsd's PPS (SHM 1) is the clock ntpsec follows.
  - name: gps-pps-selected
    command:
      run: [ntpq, -pn]
      expect: { stdout_matches: '(?m)^\*SHM\(1\)\s+\.PPS\.' }
  # PTP (health checks take no `when`: drop these two with ptp_enabled: false).
  - name: ptp4l-master
    command:
      run: [pmc, -u, -b, "0", GET PORT_DATA_SET]
      expect: { stdout_matches: 'portState\s+MASTER' }
  - name: phc2sys
    systemd: { unit: 'phc2sys-{{ vars.ptp_interface }}', state: active, min_uptime: 30s }
  # Informational: missing metrics mustn't hold up a rollout. Fresh and up
  # means the timer runs and ntpd answers its control queries.
  - name: metrics
    file:
      path: '{{ vars.o11y_textfile_dir }}/ntpsec.prom'
      max_age: 3m
      contains: 'time_metrics_up{source="ntpsec"} 1'
    required: false
