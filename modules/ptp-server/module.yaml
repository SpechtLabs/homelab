name: ptp-server
description: GPS-disciplined time server. gpsd + PPS feed chrony (NTP); ptp4l and phc2sys serve PTP on the NIC.
when: 'host.groups contains "ptp-grandmaster"'
needs: [pi-firmware]       # the PPS overlay and UART come from config.txt
tags: [time]
vars:
  ptp_gps_device: /dev/ttyAMA0
  ptp_pps_device: /dev/pps0
  ptp_gpsd_options: "-n"
  ptp_gpsd_usbauto: "false"
  ptp_interface: eth0
tasks:
  # One NTP daemon. The Ansible role installed both chrony and ntpsec, which
  # both want UDP/123 and the system clock; chrony is the one wired to gpsd.
  - apt.package: { names: [ntp, ntpsec], state: absent }
    id: no-ntpsec
    removal: leave
  - apt.package:
      names: [pps-tools, gpsd, gpsd-clients, chrony, linuxptp]

  - file.template: { src: gpsd.j2, dest: /etc/default/gpsd, mode: "0644" }
    notify: [restart-gpsd]
  - file.copy: { src: chrony.conf, dest: /etc/chrony/chrony.conf, mode: "0644" }
    notify: [restart-chrony]
  - file.copy: { src: ptp4l.conf, dest: /etc/linuxptp/ptp4l.conf, mode: "0644" }
    notify: [restart-ptp4l]
  - file.template:
      src: phc2sys.service.j2
      dest: '/etc/systemd/system/phc2sys-{{ vars.ptp_interface }}.service'
      mode: "0644"
    id: phc2sys-unit
    notify: [restart-phc2sys]
  # The role wrote the unit under /lib, where package files belong.
  - file.absent: { path: '/lib/systemd/system/phc2sys-{{ vars.ptp_interface }}.service' }
    id: phc2sys-legacy-unit
    removal: leave

  - systemd.unit: { name: gpsd, enabled: true, active: true }
  - systemd.unit: { name: chrony, enabled: true, active: true }
  - systemd.unit: { name: 'ptp4l@{{ vars.ptp_interface }}', enabled: true, active: true }
    id: ptp4l-service
  - systemd.unit: { name: 'phc2sys-{{ vars.ptp_interface }}', enabled: true, active: true, daemon_reload: true }
    id: phc2sys-service

handlers:
  restart-gpsd:    { systemd.restart: { name: gpsd } }
  restart-chrony:  { systemd.restart: { name: chrony } }
  restart-ptp4l:   { systemd.restart: { name: 'ptp4l@{{ vars.ptp_interface }}' } }
  restart-phc2sys: { systemd.restart: { name: 'phc2sys-{{ vars.ptp_interface }}' } }

health:
  - name: gpsd
    systemd: { unit: gpsd, state: active }
  - name: chrony
    systemd: { unit: chrony, state: active, min_uptime: 30s }
  - name: ptp4l
    systemd: { unit: 'ptp4l@{{ vars.ptp_interface }}', state: active }
  - name: phc2sys
    systemd: { unit: 'phc2sys-{{ vars.ptp_interface }}', state: active }
  - name: pps-locked
    command:
      run: [chronyc, -n, sources]
      expect: { stdout_matches: '#\*\s+PPS' }
    required: false       # takes a few minutes after a restart to select PPS
