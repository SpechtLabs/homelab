name: compute-blade-agent
description: compute-blade-agent on the compute blades (fan curve, health LEDs, button gestures, power policy, metrics on :9666) and bladectl's mTLS API on :8081, announced via mDNS.
when: 'host.groups contains "blades"'
tags: [hardware]
tasks:
  # The release's .deb, at exactly this version (bladectl comes with it).
  - apt.package:
      name: compute-blade-agent
      version: '{{ vars.compute_blade_agent_version }}'
      deb: 'https://github.com/compute-blade-community/compute-blade-agent/releases/download/v{{ vars.compute_blade_agent_version }}/compute-blade-agent_{{ vars.compute_blade_agent_version }}_linux_arm64.deb'
    removal: leave
    notify: [restart]

  # Every setting spelled out: gRPC on TCP :8081 with mTLS (bladectl from
  # elsewhere), a three-step fan curve, health indicators, power policy,
  # button gestures and mDNS discovery.
  - file.template: { src: config.yaml.j2, dest: /etc/compute-blade-agent/config.yaml, owner: root, group: root, mode: "0644" }
    id: agent-config
    removal: leave
    notify: [restart]

  # The agent makes its server certificate and root's bladectl client
  # certificate itself, valid for one year, and only when the files are
  # missing (its CA lasts ten). Delete them 30 days before either expires and
  # the restart makes new ones under the same CA. Afterwards, refresh your
  # bladectl config: `mise run bladectl-config`.
  # Only a certificate that exists and is about to expire counts: a missing
  # file or tool must not delete and restart on every run. (A missing server
  # certificate fails the api-certificate health check instead.)
  - apt.package: { name: openssl }
    removal: leave                  # the system's openssl: never uninstall it
  - command.run:
      run: [rm, -f, /etc/compute-blade-agent/server.pem, /etc/compute-blade-agent/server-key.pem, /root/.config/bladectl/config.yaml]
      only_if: >-
        { test -f /etc/compute-blade-agent/server.pem &&
        ! openssl x509 -checkend 2592000 -noout -in /etc/compute-blade-agent/server.pem; } ||
        { c=$(grep -m1 client-certificate-data /root/.config/bladectl/config.yaml 2>/dev/null | awk '{print $2}') &&
        test -n "$c" && ! echo "$c" | base64 -d | openssl x509 -checkend 2592000 -noout; }
    id: agent-certificates
    removal: leave
    notify: [restart]

  # The agent is the package's /usr/bin/compute-blade-agent. Testing a build on
  # a blade (the agent's docs/how-to/test-on-a-blade.md and its e2e runs)
  # swaps ExecStart through a drop-in and leaves the binaries in /usr/local;
  # a rollout puts the packaged agent back.
  - file.absent: { path: /etc/systemd/system/compute-blade-agent.service.d/dev.conf }
    removal: leave
    notify: [restart]
  - file.absent: { path: /etc/systemd/system/compute-blade-agent.service.d/e2e.conf }
    removal: leave
    notify: [restart]
  - file.absent: { path: /usr/local/lib/cba-e2e }
    removal: leave

  - systemd.unit: { name: compute-blade-agent, enabled: true, active: true, daemon_reload: true }

handlers:
  restart: { systemd.restart: { name: compute-blade-agent } }

health:
  - name: agent
    systemd: { unit: compute-blade-agent, state: active, min_uptime: 30s }
  - name: metrics
    http: { url: 'http://127.0.0.1:9666/metrics' }
  - name: api-certificate
    command:
      run: [openssl, x509, -checkend, "1209600", -noout, -in, /etc/compute-blade-agent/server.pem]
      expect: { exit: 0 }
