name: dotfiles
description: cedi/dotfiles for the admin account, and fish as its login shell.
when: 'host.groups contains "debian"'
needs: [base]
tags: [base, user]
vars:
  dotfiles_repo: https://github.com/cedi/dotfiles.git
  dotfiles_ref: main
  dotfiles_preset: server          # server, core or full
  # The fleet sets /usr/bin/fish (vars/defaults.yaml); "" leaves the shell alone.
  login_shell: ""
tasks:
  # The shell's package, for a managed login shell.
  - apt.package: { name: '{{ vars.login_shell | basename }}' }
    id: login-shell-package
    when: 'vars.login_shell != ""'

  - git.repository:
      repo: '{{ vars.dotfiles_repo }}'
      ref: '{{ vars.dotfiles_ref }}'
      path: '{{ vars.admin_home }}/.dotfiles'
      owner: '{{ vars.admin_user }}'
    id: dotfiles-checkout
    tags: [network]
    removal: leave                  # never delete someone's home-directory checkout

  # Install once per pinned commit, before fish becomes the login shell: the
  # fish config expects the tools the installer provides (mise and friends).
  # The marker makes it idempotent and catches hosts whose checkout was already
  # at the pin but never installed for this account.
  - command.run:
      run: >-
        test "$(git rev-parse HEAD)" = "{{ vars.dotfiles_ref }}" &&
        bash install_linux.sh --yes --preset {{ vars.dotfiles_preset }} &&
        mkdir -p "$HOME/.local/state" &&
        echo "{{ vars.dotfiles_ref }}" > "$HOME/.local/state/buckle-dotfiles"
      unless: 'grep -qx "{{ vars.dotfiles_ref }}" "{{ vars.admin_home }}/.local/state/buckle-dotfiles"'
      cwd: '{{ vars.admin_home }}/.dotfiles'
      user: '{{ vars.admin_user }}'
      env: { HOME: '{{ vars.admin_home }}', DOTFILES_NO_UPDATE: "1" }   # the pin decides the commit, not the installer
      timeout: 20m
    id: dotfiles-install
    removal: leave

  - user.account:
      name: '{{ vars.admin_user }}'
      shell: '{{ vars.login_shell }}'
    id: admin-login-shell
    when: 'vars.login_shell != ""'
    removal: leave                  # removing this task must not userdel the admin
