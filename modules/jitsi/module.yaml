name: jitsi
description: Jitsi Meet (Prosody, jicofo, videobridge, nginx, coturn) on meet, adopted from its quick-install.
when: 'host.groups contains "jitsi"'
tags: [jitsi]
# The files started as the quick-install's own output (adopted 2026-11-18);
# Prosody's site config and the nginx site are rebased on the package
# templates of the pinned version (see README: Upgrade Jitsi): edit them here.
# The three shared secrets live in the server's secret store. TLS stays with
# the quick-install's acme.sh (root's crontab, /opt/acmesh), whose reload hook
# restarts nginx and copies the certificate to coturn.
vars:
  jitsi_jvb_muc_nickname: ""
  jitsi_packages: {}
tasks:
  # Sources: deb822 files with their signing keys (the quick-install's lists
  # trusted Prosody's repository without a signature check).
  - file.absent: { path: /etc/apt/sources.list.d/jitsi-stable.list }
    removal: leave
  - file.absent: { path: /etc/apt/sources.list.d/prosody-debian-packages.list }
    removal: leave
  - apt.repository:
      name: jitsi
      uri: https://download.jitsi.org
      suites: [stable/]
      signed_by: { url: https://download.jitsi.org/jitsi-key.gpg.key }
    retry: { limit: 3, delay: 30s }   # apt's list lock isn't covered by its lock timeout
  - apt.repository:
      name: prosody
      uri: https://packages.prosody.im/debian
      suites: ['{{ host.facts.os.codename }}']
      components: [main]
      # A binary keyring despite the .key name (apt can't read it as .asc).
      signed_by: { keyring_url: https://prosody.im/files/prosody-debian-packages.key }
    retry: { limit: 3, delay: 30s }

  # Versions: pinned (apt preferences) and installed at exactly these. Bump them
  # together in vars, read the release notes, and check the plan's file diffs.
  - file.template: { src: apt-pin.j2, dest: /etc/apt/preferences.d/buckle-jitsi, mode: "0644" }
    id: jitsi-apt-pin
  # One apt transaction for the whole set: jitsi-meet depends on exact versions
  # of its parts, so moving them one at a time could make apt remove some.
  # --no-remove: abort rather than take anything away. Their postinsts migrate
  # configs; the templates below already hold the result (checked by
  # upgrading a container over these files), and restart what changed.
  - command.run:
      run:
        - sh
        - -c
        - >-
          apt-get install -y --no-remove -o DPkg::Lock::Timeout=300
          -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold
          {% for name, version in vars.jitsi_packages | items %}{{ name }}={{ version }} {% endfor %}
      unless:
        - sh
        - -c
        - >-
          {% for name, version in vars.jitsi_packages | items %}[ "$(dpkg-query -W -f='${Version}' {{ name }} 2>/dev/null)" = "{{ version }}" ] && {% endfor %}true
      env: { DEBIAN_FRONTEND: noninteractive }
      timeout: 20m
    id: jitsi-packages
    retry: { limit: 2, delay: 30s }
    removal: leave

  # Prosody: XMPP for the web clients, jicofo and the bridge. The main config is
  # prosody.im's stock 13.x file plus the conf.d include it lacks: without it
  # Prosody served only localhost, jicofo and the bridge could never log in,
  # and no meeting could start (from about July 2025 to 2026-11-18).
  - file.template: { src: prosody-main.cfg.lua.j2, dest: /etc/prosody/prosody.cfg.lua, owner: root, group: prosody, mode: "0640" }
    id: prosody-main
    removal: leave
    notify: [restart-prosody]
  - file.template:
      src: prosody.cfg.lua.j2
      dest: '/etc/prosody/conf.avail/{{ vars.jitsi_domain }}.cfg.lua'
      mode: "0644"
    id: prosody-site
    removal: leave
    notify: [restart-prosody]
  - file.symlink:
      path: '/etc/prosody/conf.d/{{ vars.jitsi_domain }}.cfg.lua'
      target: '/etc/prosody/conf.avail/{{ vars.jitsi_domain }}.cfg.lua'
    id: prosody-site-enabled
    removal: leave
    notify: [restart-prosody]

  # Prosody's own certificates for meet's internal XMPP: jicofo and the bridge
  # log in over TLS on localhost and verify them against the system (and so
  # Java) trust store. The quick-install made them valid for one year, and
  # they expired on 2026-01-22. Renew 30 days before expiry, for ten years,
  # at the quick-install's paths, with the names prosodyctl gave them: Prosody
  # presents the domain's certificate to jicofo and the bridge too, so it has
  # to name auth.<domain> and every component.
  - command.run:
      run:
        - sh
        - -c
        - >-
          set -e; D={{ vars.jitsi_domain }};
          gen() { h=$1; san=""; for n in "$@"; do san="$san,DNS:$n"; done;
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 3650 -subj "/CN=$h" -addext "subjectAltName=${san#,}"
          -keyout /var/lib/prosody/$h.key -out /var/lib/prosody/$h.crt 2>/dev/null;
          chown prosody:prosody /var/lib/prosody/$h.key /var/lib/prosody/$h.crt;
          chmod 0640 /var/lib/prosody/$h.key; chmod 0644 /var/lib/prosody/$h.crt; };
          gen $D auth.$D internal.auth.$D conference.$D focus.$D lobby.$D breakout.$D endconference.$D
          metadata.$D speakerstats.$D avmoderation.$D polls.$D filesharing.$D;
          gen auth.$D internal.auth.$D
      unless:
        - sh
        - -c
        - >-
          openssl x509 -checkend 2592000 -noout -in /var/lib/prosody/{{ vars.jitsi_domain }}.crt &&
          openssl x509 -checkend 2592000 -noout -in /var/lib/prosody/auth.{{ vars.jitsi_domain }}.crt &&
          openssl x509 -noout -ext subjectAltName -in /var/lib/prosody/{{ vars.jitsi_domain }}.crt | grep -q 'DNS:auth.{{ vars.jitsi_domain }}'
      timeout: 5m
    id: prosody-internal-certs
    removal: leave
    # Trust them in this same run: the trust step below decides at plan time,
    # before the renewal, so on its own it would only catch up on the next run.
    notify: [trust-internal-certs, restart-prosody, restart-jicofo, restart-jvb]
  # ...and trusted: whenever Java's store lacks the current certificate (after
  # a renewal, or if anything rebuilt the store), link both into the system
  # store as the quick-install did, rebuild it (ca-certificates-java rebuilds
  # Java's), and restart what logs in with it.
  - command.run:
      run:
        - sh
        - -c
        - >-
          set -e;
          for h in {{ vars.jitsi_domain }} auth.{{ vars.jitsi_domain }}; do
          ln -sfn /var/lib/prosody/$h.crt /usr/local/share/ca-certificates/$h.crt;
          done;
          update-ca-certificates --fresh >/dev/null
      unless:
        - sh
        - -c
        - >-
          fp=$(openssl x509 -noout -fingerprint -sha256 -in /var/lib/prosody/auth.{{ vars.jitsi_domain }}.crt | cut -d= -f2) &&
          keytool -list -cacerts -storepass changeit 2>/dev/null | grep -q "$fp"
      timeout: 5m
    id: prosody-internal-certs-trusted
    removal: leave
    notify: [restart-prosody, restart-jicofo, restart-jvb]

  # jicofo: conference focus.
  - file.template: { src: jicofo.conf.j2, dest: /etc/jitsi/jicofo/jicofo.conf, owner: jicofo, group: jitsi, mode: "0644" }
    id: jicofo-conf
    removal: leave
    notify: [restart-jicofo]
  - file.template: { src: jicofo.env.j2, dest: /etc/jitsi/jicofo/config, owner: jicofo, group: jitsi, mode: "0644" }
    id: jicofo-env
    removal: leave
    notify: [restart-jicofo]
  - file.template: { src: jicofo-logging.properties.j2, dest: /etc/jitsi/jicofo/logging.properties, owner: jicofo, group: jitsi, mode: "0644" }
    id: jicofo-logging
    removal: leave
    notify: [restart-jicofo]

  # Videobridge: the media.
  - file.template: { src: jvb.conf.j2, dest: /etc/jitsi/videobridge/jvb.conf, owner: jvb, group: jitsi, mode: "0644" }
    id: jvb-conf
    removal: leave
    notify: [restart-jvb]
  - file.template: { src: sip-communicator.properties.j2, dest: /etc/jitsi/videobridge/sip-communicator.properties, owner: jvb, group: jitsi, mode: "0644" }
    id: jvb-sip-communicator
    removal: leave
    notify: [restart-jvb]
  - file.template: { src: jvb.env.j2, dest: /etc/jitsi/videobridge/config, owner: jvb, group: jitsi, mode: "0644" }
    id: jvb-env
    removal: leave
    notify: [restart-jvb]
  - file.template: { src: jvb-logging.properties.j2, dest: /etc/jitsi/videobridge/logging.properties, owner: jvb, group: jitsi, mode: "0644" }
    id: jvb-logging
    removal: leave
    notify: [restart-jvb]

  # Web: config.js and the nginx site in front of everything.
  - file.template:
      src: config.js.j2
      dest: '/etc/jitsi/meet/{{ vars.jitsi_domain }}-config.js'
      mode: "0644"
    id: web-config
    removal: leave
  - file.template:
      src: nginx-site.conf.j2
      dest: '/etc/nginx/sites-available/{{ vars.jitsi_domain }}.conf'
      mode: "0644"
    id: nginx-site
    removal: leave
    notify: [reload-nginx]
  - file.symlink:
      path: '/etc/nginx/sites-enabled/{{ vars.jitsi_domain }}.conf'
      target: '/etc/nginx/sites-available/{{ vars.jitsi_domain }}.conf'
    id: nginx-site-enabled
    removal: leave
    notify: [reload-nginx]

  # coturn: TURN relay for clients that can't reach the bridge directly. The
  # config holds the TURN secret: readable by coturn (turnserver) only.
  - file.template: { src: turnserver.conf.j2, dest: /etc/turnserver.conf, owner: root, group: turnserver, mode: "0640" }
    id: coturn-conf
    removal: leave
    notify: [restart-coturn]
  - file.template: { src: coturn.default.j2, dest: /etc/default/coturn, mode: "0644" }
    id: coturn-default
    removal: leave
    notify: [restart-coturn]

  - systemd.unit: { name: prosody, enabled: true, active: true }
  - systemd.unit: { name: jicofo, enabled: true, active: true }
  - systemd.unit: { name: jitsi-videobridge2, enabled: true, active: true }
  - systemd.unit: { name: nginx, enabled: true, active: true }
  - systemd.unit: { name: coturn, enabled: true, active: true }

handlers:
  trust-internal-certs:
    command.run:
      run:
        - sh
        - -c
        - >-
          set -e;
          for h in {{ vars.jitsi_domain }} auth.{{ vars.jitsi_domain }}; do
          ln -sfn /var/lib/prosody/$h.crt /usr/local/share/ca-certificates/$h.crt;
          done;
          update-ca-certificates --fresh >/dev/null
  restart-prosody: { systemd.restart: { name: prosody } }
  restart-jicofo:  { systemd.restart: { name: jicofo } }
  restart-jvb:     { systemd.restart: { name: jitsi-videobridge2 } }
  restart-coturn:  { systemd.restart: { name: coturn } }
  reload-nginx:    { systemd.reload: { name: nginx } }

health:
  - name: prosody
    systemd: { unit: prosody, state: active }
  - name: jicofo
    systemd: { unit: jicofo, state: active, min_uptime: 30s }
  - name: videobridge
    http: { url: 'http://127.0.0.1:8080/about/health' }
  # The whole chain: jicofo is logged in to Prosody and sees the bridge in its
  # brewery room. This is what was missing for months.
  - name: bridge-available
    http:
      url: 'http://127.0.0.1:8888/stats'
      expect: { status: 200, body_contains: '"operational_bridge_count":1' }
  - name: coturn
    systemd: { unit: coturn, state: active }
  - name: site
    http:
      url: 'https://{{ vars.jitsi_domain }}/'
      expect: { status: 200 }
  # The internal XMPP certificate (renewed above, 30 days ahead).
  - name: internal-certificate
    command:
      run: ['openssl', 'x509', '-checkend', '1209600', '-noout', '-in', '/var/lib/prosody/auth.{{ vars.jitsi_domain }}.crt']
      expect: { exit: 0 }
  # acme.sh renews at 60 days; fail with two weeks still left.
  - name: certificate
    command:
      run: ['openssl', 'x509', '-checkend', '1209600', '-noout', '-in', '/etc/jitsi/meet/{{ vars.jitsi_domain }}.crt']
      expect: { exit: 0 }
