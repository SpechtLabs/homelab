# Backstage catalog entry for Jitsi Meet on meet. Not read by Buckle:
# Backstage reads it through the Location in the repo-root catalog-info.yaml.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: jitsi-meet
  title: Jitsi Meet
  description: >-
    Jitsi Meet for meet.realschule-rottweil.de on meet: Prosody, jicofo,
    the videobridge, nginx and coturn, from the quick-install, versions
