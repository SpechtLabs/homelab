name: tsidp
description: tsidp, the tailnet's OIDC identity provider (idp.<tailnet>), exposed via Funnel.
when: 'host.groups contains "tsidp"'
tags: [identity]
vars:
  tsidp_state_dir: /data
  tsidp_hostname: idp
  tsidp_port: 443
  tsidp_log: info
  tsidp_use_funnel: true
  tsidp_enable_sts: true
  tsidp_arch: '{{ "arm64" if host.facts.hardware.arch == "aarch64" else "amd64" }}'
  tsidp_advertise_tags: "tag:tsidp"
tasks:
  # Release assets, not the GitHub API: the API allows 60 calls an hour per IP,
  # shared by every host at home, and github.release spends one per plan until
  # the pinned version is installed. Each version unpacks into its own
  # directory; a bump downloads, links and restarts, and removes the old one.
  - file.directory: { path: /var/cache/buckle-releases, mode: "0755" }
  - file.download:
      url: 'https://github.com/tailscale/tsidp/releases/download/v{{ vars.tsidp_version }}/tsidp_{{ vars.tsidp_version }}_linux_{{ vars.tsidp_arch }}.tar.gz'
      dest: '/var/cache/buckle-releases/tsidp_{{ vars.tsidp_version }}.tar.gz'
      checksum: 'https://github.com/tailscale/tsidp/releases/download/v{{ vars.tsidp_version }}/tsidp_{{ vars.tsidp_version }}_checksums.txt'
      mode: "0644"
    tags: [network]
  - archive.extract:
      src: '/var/cache/buckle-releases/tsidp_{{ vars.tsidp_version }}.tar.gz'
      dest: '/opt/tsidp/{{ vars.tsidp_version }}'
      include: [tsidp]
      creates: tsidp
  - file.symlink:
      path: /usr/local/bin/tsidp
      target: '/opt/tsidp/{{ vars.tsidp_version }}/tsidp'
      force: true
    id: tsidp-binary
    notify: [restart]
  # Older versions and their tarballs, once the pinned one is in place (the
  # running process keeps its binary's inode until the restart).
  - command.run:
      run: >-
        find /opt/tsidp -mindepth 1 -maxdepth 1 ! -name '{{ vars.tsidp_version }}' -exec rm -rf {} + ;
        find /var/cache/buckle-releases -maxdepth 1 -name 'tsidp_*.tar.gz' ! -name 'tsidp_{{ vars.tsidp_version }}.tar.gz' -delete
      only_if: >-
        test -x '/opt/tsidp/{{ vars.tsidp_version }}/tsidp' &&
        { find /opt/tsidp -mindepth 1 -maxdepth 1 ! -name '{{ vars.tsidp_version }}';
        find /var/cache/buckle-releases -maxdepth 1 -name 'tsidp_*.tar.gz' ! -name 'tsidp_{{ vars.tsidp_version }}.tar.gz'; } | grep -q .
    id: tsidp-old-versions
    removal: leave

  # Already holds the node key from the Ansible days; never removed.
  - file.directory: { path: '{{ vars.tsidp_state_dir }}', mode: "0700" }
    id: tsidp-state
    removal: leave

  - file.template: { src: tsidp.env.j2, dest: /etc/default/tsidp, mode: "0600" }
    notify: [restart]
  - file.template: { src: tsidp.service.j2, dest: /etc/systemd/system/tsidp.service, mode: "0644" }
    notify: [restart]
  - systemd.unit: { name: tsidp, enabled: true, active: true, daemon_reload: true }

  # `go install` put the old binary here; Go itself can go too, by hand.
  - file.absent: { path: /root/go/bin/tsidp }
    removal: leave

handlers:
  restart: { systemd.restart: { name: tsidp } }

health:
  - name: unit
    systemd: { unit: tsidp, state: active, min_uptime: 30s }
  - name: discovery
    http:
      url: 'https://{{ vars.tsidp_hostname }}.{{ vars.tailnet }}/.well-known/openid-configuration'
      expect: { status: 200, body_contains: issuer }
