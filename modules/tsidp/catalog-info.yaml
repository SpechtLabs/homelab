# Backstage catalog entry for tsidp and the OIDC API it provides. Not read by
# Buckle: Backstage reads it through the Location in the repo-root
# catalog-info.yaml.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: tsidp
  description: >-
    tsidp, the tailnet's OIDC identity provider, on isa as its own tailnet
    node `idp`, public through Funnel.
  annotations:
    github.com/project-slug: SpechtLabs/homelab
  links:
    - url: https://idp.sphinx-map.ts.net
      title: tsidp
    - url: https://github.com/tailscale/tsidp
      title: Upstream
spec:
  type: service
  owner: group:spechtlabs
  system: tailnet
  lifecycle: production
  providesApis:
    - api:tsidp-oidc
  dependsOn:
    - resource:isa
    - resource:tailnet
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: tsidp-oidc
  title: tsidp OIDC
  description: OpenID Connect provider for the tailnet's users, public through Funnel.
  annotations:
    # https://idp.<tailnet>: a device, not a Service (it relies on Funnel and
    # on capability grants matched on its own address). Every member signs in
    # here; relying parties call it as tag:tsidp-client, whatever else they
    # are; the o11y collector probes it. Backstage renders the tailnet
    # policy's grants from these (tailscale/policy/).
    specht-labs.de/tailnet-dst: tag:tsidp
    specht-labs.de/tailnet-ports: tcp:443
    specht-labs.de/tailnet-client-tag: tag:tsidp-client
    specht-labs.de/tailnet-allow: autogroup:member, tag:o11y-collector
spec:
  type: openapi
  owner: group:spechtlabs
  system: tailnet
  lifecycle: production
  definition:
    $text: ./tsidp-oidc.openapi.yaml
