name: base
description: Hostname, locale and the bootstrap packages every Debian host gets.
when: 'host.groups contains "debian"'
tags: [base]
vars:
  locale: en_US.UTF-8
tasks:
  - hostname.set: { name: '{{ host.id }}' }

  # Buckle gives every apt-get call 30 minutes (APT_TIMEOUT, not configurable)
  # and kills it after that. A dist-upgrade killed mid-configure leaves dpkg
  # half-done, and every apt step after it fails: clusterpi-worker2's nightly
  # upgrade (361 packages on an SD card) on 2026-11-19. Finish the interrupted
  # configure first. Only for states `--configure -a` can fix (not
  # half-installed, which needs a reinstall), so the step can't repeat forever.
  - command.run:
      run: [dpkg, --configure, -a, --force-confdef, --force-confold]
      only_if: >-
        dpkg-query -W -f='${db:Status-Status}\n' |
        grep -qxE 'unpacked|half-configured|triggers-(awaited|pending)'
      env: { DEBIAN_FRONTEND: noninteractive }
      timeout: 60m
    id: dpkg-repair
    removal: leave

  - apt.update: { max_age: 6h }
  - apt.package:
      names: [git, curl, sudo, locales]

  - file.line:
      path: /etc/locale.gen
      regex: '^#?\s*{{ vars.locale | replace(".", "\\.") }} UTF-8'
      line: '{{ vars.locale }} UTF-8'
    notify: [locale-gen]
  # PackageKit (desktop package management; part of Raspberry Pi OS and Ubuntu
  # images) starts from apt's own hook after every update and refreshes the
  # cache itself, holding apt's list lock just as Buckle's next apt step runs:
  # storagepi-ceph3's first apply and meet's apt sources failed on it
  # (2026-11-18). No server here uses it; apt's hook tolerates it masked.
  - systemd.unit: { name: packagekit, active: false, masked: true }

  - file.template:
      src: lang.sh.j2
      dest: /etc/profile.d/lang.sh
      mode: "0644"
      owner: root
      group: root

# On demand from the host page, never in a revision's rollout. `upgrade` also
# runs nightly through schedules/nightly-upgrades.yaml.
actions:
  upgrade:
    name: Upgrade packages
    apt.upgrade: { autoremove: true }
    notify: [reboot-if-required]
  reboot:
    name: Reboot
    system.reboot: { delay: 5s, timeout: 10m }
    confirm: true
    description: Reboot this host now
  # `upgrade` only reboots when its own run changed something, so a kernel an
  # earlier run installed without rebooting stayed pending for good: three k3s
  # workers sat on 6.12.34 with 6.12.115 installed (2026-11-19). This reboots
  # whenever one is pending; it runs nightly after the upgrades
  # (schedules/nightly-kernel-reboots.yaml).
  reboot-if-required:
    name: Reboot for a pending kernel
    description: Reboot only if a newer kernel is installed than the one running (or /run/reboot-required exists)
    system.reboot:
      delay: 5s
      timeout: 10m
      # Debian and Raspberry Pi OS kernels don't create /run/reboot-required
      # (only Ubuntu's update-notifier does), so also reboot when a newer
      # kernel of the running flavour (2712, v8, generic, ...) is installed.
      only_if: &reboot-check
        - sh
        - -c
        - |
          test -f /run/reboot-required && exit 0
          r=$(uname -r)
          newest=$(ls /boot/vmlinuz-*-"${r##*-}" 2>/dev/null | sed 's|^/boot/vmlinuz-||' | sort -V | tail -n1)
          test -n "$newest" && test "$newest" != "$r"

handlers:
  locale-gen:
    command.run: { run: [locale-gen] }
  # The same check as the reboot-if-required action, after an upgrade that
  # changed something.
  reboot-if-required:
    system.reboot:
      only_if: *reboot-check
