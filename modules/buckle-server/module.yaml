name: buckle-server
description: The Buckle server's host. Keeps the secrets directory root-only; the server's config is installed by hand (bootstrap/), its backups are modules/nas-backup's.
when: 'host.groups contains "buckle-server"'
tags: [buckle]
tasks:
  # Only the directory: what's in it is installed by hand (bootstrap/README.md)
  # so that no revision can break the server's own config. The secrets it
  # holds go to the NAS nightly (vars/backups.yaml, buckle-secrets).
  - file.directory: { path: /etc/buckle/secrets, mode: "0700", owner: root, group: root }
    id: buckle-secrets-dir
    removal: leave
