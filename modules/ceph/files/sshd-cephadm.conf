# Buckle (modules/ceph). cephadm manages the hosts over SSH as root. On the
# tailnet address Tailscale SSH answers port 22 (by tailnet identity, not by
# key), so sshd also listens on 2222 for cephadm, root only. root's one key is
# cephadm's, accepted from tailnet addresses only (from= in authorized_keys).
Port 22
Port 2222

Match LocalPort 2222
	AllowUsers root
