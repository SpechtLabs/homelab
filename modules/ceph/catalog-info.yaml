# Backstage catalog entries for the Ceph cluster, its RBD and S3 APIs and the
# RBD pool labk3s uses (internal to the ceph system: labk3s consumes the API). Not read by Buckle: Backstage reads it through the Location in
# the repo-root catalog-info.yaml. Runbook: docs/ceph.md.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ceph
  title: Ceph (homelab-ceph)
  description: >-
    Ceph 20 through cephadm on storagepi-ceph1..3, all over the tailnet:
    three mons, three mgrs, an OSD per host on the NVMe, RGW on
    storagepi-ceph2. Pools replicated three times. Buckle preps the hosts
    and applies the orchestrator specs, pools, keys and S3 users.
  annotations:
    github.com/project-slug: SpechtLabs/homelab
    # The tag its hosts' traffic comes from on the tailnet.
    specht-labs.de/tailnet-src: tag:ceph
  links:
    - url: https://github.com/SpechtLabs/homelab/blob/main/docs/ceph.md
      title: Runbook (docs/ceph.md)
spec:
  type: service
  owner: group:spechtlabs
  system: ceph
  lifecycle: production
  providesApis:
    - api:ceph-rbd
    - api:ceph-s3
    - api:ceph-cluster
  # The hosts talk to each other: mons, OSDs, mgr and cephadm.
  consumesApis:
    - api:ceph-cluster
  dependsOn:
    - resource:storagepi-ceph1
    - resource:storagepi-ceph2
    - resource:storagepi-ceph3
    - resource:tailnet
    # Mons refuse to form quorum on clock skew.
    - component:time-sync
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ceph-rbd-k3s
  title: Ceph RBD pool k3s
  description: >-
    The RBD pool for labk3s's volumes (ceph-csi, StorageClass ceph-rbd),
    accessed as client.k3s (an aes key: the nodes' krbd can't use aes256k).
  tags: [ceph, rbd]
spec:
  type: rbd-pool
  owner: group:spechtlabs
  system: ceph
  dependsOn:
    - component:ceph
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ceph-s3
  title: Ceph S3 (RGW)
  description: S3 on the Ceph cluster, for experiments.
spec:
  type: s3
  owner: group:spechtlabs
  system: ceph
  lifecycle: experimental
  definition: |
    S3-compatible API (Ceph RGW): http://storagepi-ceph2.sphinx-map.ts.net:7480
    Users (ceph_rgw_users in vars/group-ceph.yaml): experiments.
    Keys: docs/ceph.md ("S3").
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ceph-rbd
  title: Ceph RBD
  description: Block devices from the Ceph cluster's RBD pools, through its monitors.
  annotations:
    # Where tailnet consumers reach it: the Ceph hosts themselves (clients
    # reach every OSD at its own address, so no Service). Backstage renders
    # the tailnet policy's grants from these (tailscale/policy/). The OSD
    # range skips 7480, RGW's port.
    specht-labs.de/tailnet-dst: tag:ceph
    specht-labs.de/tailnet-ports: tcp:3300,tcp:6789,tcp:6800-7479,tcp:7481-7568
spec:
  type: ceph-rbd
  owner: group:spechtlabs
  system: ceph
  lifecycle: production
  definition: |
    Ceph's own protocol (msgr v1/v2) to the monitors, then the OSDs, at the
    storagepi hosts' tailnet addresses (public_network 100.64.0.0/10):
      mon storagepi-ceph1  100.105.212.35:6789
      mon storagepi-ceph2  100.107.71.68:6789
      mon storagepi-ceph3  100.118.224.54:6789
    fsid 85412c6c-e39c-11f1-ba59-2ccf678b0944.

    Pools and their clients (Buckle creates both, vars/group-ceph.yaml):
      k3s   client.k3s, AES-128 key (the nodes' kernel rbd can't use
            aes256k); labk3s's ceph-csi-rbd, StorageClass ceph-rbd.
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ceph-cluster
  title: Ceph cluster traffic
  description: What the Ceph hosts speak among themselves, over the tailnet.
  annotations:
    # Backstage renders the tailnet policy's grants from these
    # (tailscale/policy/): the hosts reach each other on cephadm's sshd, the
    # mons and the OSD/mgr range, which skips 7480 (RGW).
    specht-labs.de/tailnet-dst: tag:ceph
    specht-labs.de/tailnet-ports: tcp:2222,tcp:3300,tcp:6789,tcp:6800-7479,tcp:7481-7568
spec:
  type: ceph-cluster
  owner: group:spechtlabs
  system: ceph
  lifecycle: production
  definition: |
    Between storagepi-ceph1..3, on their tailnet addresses (public_network
    100.64.0.0/10):
      2222        cephadm's sshd (root, cephadm's key only)
      3300, 6789  mons (msgr v2, v1)
      6800-7568   OSDs and mgr (ms_bind_port_max), except 7480 (RGW)
