# Backstage catalog entries for Grafana Alloy: the agent on every host and the
# collector on isa, which adds an OTLP receiver, remote scrapes and black-box
# probes. Not read by Buckle: Backstage reads it through the Location in the
# repo-root catalog-info.yaml. Loki, Mimir and Tempo run on specht-labs
# (k8s-deployment); their ingest APIs are k8s-deployment's. The homelab hosts
# write to the homelab tenants, hole and meet to the spechtlabs ones.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: alloy
  title: Alloy (host agent)
  description: >-
    Grafana Alloy on every Debian host: the journal and /var/log to Loki,
    node metrics, node_exporter textfiles and the host's own exporters
    (rpi_exporter, blade, Ceph, Jitsi) to Mimir.
  annotations:
    github.com/project-slug: cedi/homelab
    # The tags its traffic comes from on the tailnet (the hosts').
    specht-labs.de/tailnet-src: tag:homelab
  links:
    - url: https://grafana.com/docs/alloy/latest/
      title: Alloy docs
spec:
  type: service
  owner: group:spechtlabs
  system: homelab
  lifecycle: production
  consumesApis:
    - api:loki-push
    - api:mimir-remote-write
  dependsOn:
    - resource:tailnet
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: o11y-collector
  title: o11y collector (Alloy on isa)
  description: >-
    isa's Alloy as the homelab's collector: receives OTLP (traces to Tempo),
    scrapes what can't run Alloy (the NAS's exporters, tailscaled metrics)
    and probes the homelab's services every 30 s for the availability SLOs
    in k8s-deployment (Buckle, tsidp, Home Assistant, the labk3s API, DSM,
    Jellyfin).
  annotations:
    github.com/project-slug: cedi/homelab
    # The tags its traffic comes from on the tailnet (isa's).
    specht-labs.de/tailnet-src: tag:o11y-collector
spec:
  type: service
  owner: group:spechtlabs
  system: homelab
  lifecycle: production
  subcomponentOf: component:alloy
  providesApis:
    - api:otlp-homelab
  consumesApis:
    - api:tempo-otlp
    - api:loki-push
    - api:mimir-remote-write
    - api:labk3s-kubernetes-api
    - api:jellyfin-web
    - api:home-assistant-api
  dependsOn:
    - resource:isa
    - component:nas-exporters
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: otlp-homelab
  title: Homelab OTLP receiver
  description: OTLP into the homelab tenants, on isa.
spec:
  type: otlp
  owner: group:spechtlabs
  system: homelab
  lifecycle: production
  definition: |
    OpenTelemetry Protocol on isa (tag:o11y-endpoint; who may send is in
    tailscale/policy.hujson):
      gRPC  isa.sphinx-map.ts.net:4317
      HTTP  isa.sphinx-map.ts.net:4318
    Traces go to Tempo's homelab tenant (otlphttp). No auth; tenancy is
    injected by the endpoint.
