name: k3s-server
description: The k3s control plane (single server, SQLite/kine datastore).
when: 'host.groups contains "k3s-server"'
needs: [base]
tags: [k3s]
# A change here restarts k3s under the node's pods: labk3s drains the node
# first (maintenance in buckle.yaml).
disrupts: node
vars:
  # The Tailscale Service in front of the API: labk3s.<tailnet>:6443. Its
  # name goes into the serving certificate (tls-san).
  k3s_service: labk3s
  # svc:labk3s's IPv4 (stable while the Service exists), the API's advertise-address.
  # The svc-ip health check fails when the name points elsewhere.
  k3s_service_ip: 100.67.145.122
  k3s_disable: [traefik]
  k3s_disable_network_policy: true
tasks:
  - sysctl.param: { name: net.ipv4.ip_forward, value: 1 }
  - sysctl.param: { name: net.ipv6.conf.all.forwarding, value: 1 }

  # The same binary get.k3s.io installed; the probe sees the current version,
  # so adopting an existing node is a no-op and a version bump is an upgrade.
  - github.release:
      repo: k3s-io/k3s
      version: '{{ vars.k3s_version }}'
      asset: 'k3s-{arch}'                 # aarch64 -> k3s-arm64; every k3s node is a Pi
      checksum_asset: 'sha256sum-{arch}.txt'
      dest: /usr/local/bin/k3s
      mode: "0755"
      probe: [/usr/local/bin/k3s, --version]
      probe_regex: 'k3s version (v\S+)'
    tags: [network]
    notify: [restart]

  # Flags live in k3s's own config file instead of ExecStart.
  - file.directory: { path: /etc/rancher/k3s, mode: "0755" }
  - file.template:
      src: config.yaml.j2
      dest: /etc/rancher/k3s/config.yaml
      mode: "0600"
    notify: [restart]
  - file.copy: { src: k3s.service, dest: /etc/systemd/system/k3s.service, mode: "0644" }
    notify: [restart]
  - systemd.unit: { name: k3s, enabled: true, active: true, daemon_reload: true }

  # The API as the Tailscale Service svc:{{ vars.k3s_service }} (tcp:6443,
  # passed through: k3s terminates TLS, with the name as a tls-san in config.yaml). The policy's
  # autoApprovers approve a host tagged tag:k3s-server; a second server
  # would serve it too.
  - command.run:
      run: [tailscale, serve, '--service=svc:{{ vars.k3s_service }}', --tcp=6443, 'tcp://localhost:6443']
      unless: 'tailscale serve get-config --all | grep -q "\"tcp:6443\": \"tcp://localhost:6443\""'
    id: svc-k3s
    removal: leave

  # ceph-rbd is the default StorageClass (k8s-deployment apps/ceph-csi-rbd).
  # k3s's packaged local-storage manifest marks local-path as the default and
  # is re-applied on every k3s start, so k3s skips it (a .skip file, k3s's own
  # mechanism) and local-path stays, not default: TKA's tsnet state lives on
  # it. The price: k3s no longer upgrades the local-path provisioner.
  - file.copy:
      src: local-storage.yaml.skip
      dest: /var/lib/rancher/k3s/server/manifests/local-storage.yaml.skip
      mode: "0644"
    id: skip-local-storage
  - command.run:
      run: [/usr/local/bin/k3s, kubectl, annotate, storageclass, local-path, 'storageclass.kubernetes.io/is-default-class=false', --overwrite]
      unless: >-
        test "$(/usr/local/bin/k3s kubectl get storageclass local-path
        -o jsonpath='{.metadata.annotations.storageclass\.kubernetes\.io/is-default-class}')" = false
    id: local-path-not-default
    removal: leave

  # Leftovers from k3s-ansible: the token moved into config.yaml, upgrades no
  # longer go through the install script.
  - file.absent: { path: /etc/systemd/system/k3s.service.env }
    removal: leave
  - file.absent: { path: /usr/local/bin/k3s-install.sh }
    removal: leave

handlers:
  restart: { systemd.restart: { name: k3s } }

health:
  - name: unit
    systemd: { unit: k3s, state: active, min_uptime: 60s }
  # The kubelet answers its own health endpoint: the node is running pods,
  # not just a k3s process that hasn't registered yet.
  - name: kubelet
    http: { url: 'http://127.0.0.1:10248/healthz', expect: { status: 200, body_contains: ok } }
  - name: apiserver
    command:
      run: [/usr/local/bin/k3s, kubectl, get, --raw, /readyz]
      expect: { exit: 0, stdout_matches: '^ok' }
  # ...and through the Service, checking its name in the certificate. Not
  # required: the host may not be approved yet right after a push.
  - name: svc-api
    command:
      run: [/usr/local/bin/k3s, kubectl, '--server=https://{{ vars.k3s_service }}.{{ vars.tailnet }}:6443', get, --raw, /readyz]
      expect: { exit: 0, stdout_matches: '^ok' }
    required: false
  # The advertised address is the Service's: the Kubernetes endpoint and
  # MagicDNS agree.
  - name: svc-ip
    command:
      run: "getent ahostsv4 {{ vars.k3s_service }}.{{ vars.tailnet }} | grep -qx '{{ vars.k3s_service_ip }} *STREAM.*'"
      expect: { exit: 0 }
    required: false
  - name: nodes-ready
    command:
      run: "/usr/local/bin/k3s kubectl get nodes --no-headers | awk '$2 != \"Ready\" {bad=1} END {exit bad}'"
    required: false     # one agent rebooting shouldn't fail the server's own rollout
