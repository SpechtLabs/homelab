# Backstage catalog entries for the k3s control plane, its API and the labk3s
# cluster. Not read by Buckle: Backstage reads it through the Location in the
# repo-root catalog-info.yaml. labk3s's workloads are k8s-deployment's; they
# dependOn resource:labk3s.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: k3s-server
  title: k3s server
  description: >-
    The k3s control plane on clusterpi-leader (single server, SQLite/kine
    datastore; traefik and the network policy controller off). Drained
    around disruptive runs.
  annotations:
    github.com/project-slug: cedi/homelab
    # The tag its traffic comes from on the tailnet (clusterpi-leader's).
    specht-labs.de/tailnet-src: tag:k3s-node
  links:
    - url: https://docs.k3s.io
      title: k3s docs
spec:
  type: service
  owner: group:spechtlabs
  system: labk3s
  lifecycle: production
  providesApis:
    - api:labk3s-kubernetes-api
    - api:labk3s-node-mesh
  # Its own kubelet and pods reach the API through svc:labk3s too.
  consumesApis:
    - api:labk3s-kubernetes-api
    - api:labk3s-node-mesh
  dependsOn:
    - resource:clusterpi-leader
    - resource:tailnet
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: labk3s-kubernetes-api
  title: labk3s Kubernetes API
  description: The labk3s API server.
  annotations:
    # Where tailnet consumers reach it, and who else may: admins with kubectl.
    # Backstage renders the tailnet policy's grants from these
    # (tailscale/policy/).
    specht-labs.de/tailnet-dst: svc:labk3s
    specht-labs.de/tailnet-ports: tcp:6443
    specht-labs.de/tailnet-allow: group:admins
spec:
  type: kubernetes
  owner: group:spechtlabs
  system: labk3s
  lifecycle: production
  definition: |
    Kubernetes API, https://labk3s.sphinx-map.ts.net:6443 (the Tailscale
    Service svc:labk3s, passed through to the server's tcp:6443)
    (version: k3s_version in vars/versions.yaml).
    It is also the API's advertise-address, so the `kubernetes` endpoint
    is the Service: agents (joined with K3S_TOKEN) and pods calling
    kubernetes.default reach the API only through it. Buckle applies its workloads (the root
    Argo CD Application) through the server's own admin kubeconfig
    (/etc/rancher/k3s/k3s.yaml). /readyz answers 401 to anonymous callers,
    which the o11y collector's probe counts as up.
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: labk3s
  description: >-
    The k3s cluster at home: clusterpi-leader and clusterpi-worker1..4.
    Buckle brings up k3s, seeds Argo CD once and owns the root Application
    (1-meta-labk3s); Argo CD deploys everything else from k8s-deployment.
    Volumes from Ceph (StorageClass ceph-rbd).
  annotations:
    github.com/project-slug: cedi/homelab
  tags: [kubernetes, k3s]
spec:
  type: kubernetes-cluster
  owner: group:spechtlabs
  system: labk3s
  dependsOn:
    - component:k3s-server
    - component:k3s-agent
    - component:homelab-config
    - component:k8s-deployment
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: labk3s-node-mesh
  title: labk3s node-to-node traffic
  description: What the labk3s nodes speak among themselves over the tailnet.
  annotations:
    specht-labs.de/tailnet-dst: tag:k3s-node
    specht-labs.de/tailnet-ports: udp:8472,tcp:10250,tcp:8681
spec:
  type: kubernetes-node
  owner: group:spechtlabs
  system: labk3s
  lifecycle: production
  definition: |
    Between the labk3s nodes, on their tailnet addresses (node-ip,
    flannel-iface tailscale0):
      udp 8472   flannel VXLAN (pod network)
      tcp 10250  kubelet API (exec, logs, metrics-server, Alloy's scrapes)
      tcp 8681   ceph-csi-rbd nodeplugin metrics (hostNetwork)
