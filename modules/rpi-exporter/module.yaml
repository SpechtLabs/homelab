name: rpi-exporter
description: cedi/rpi_exporter (SoC temperature, clocks, throttling) on :9243.
when: 'host.groups contains "pi"'
tags: [o11y]
vars:
  rpi_exporter_port: 9243
  rpi_exporter_vcgencmd: /usr/bin/vcgencmd
tasks:
  # Release assets, not the GitHub API (as modules/tsidp): the API allows 60
  # calls an hour per IP, shared by every host at home, and github.release
  # spent one per Pi per plan. The 1.0.11 bump (Renovate) used up the hour on
  # the first phases and the Ceph Pis failed to plan. Every Pi is aarch64.
  - file.directory: { path: /var/cache/buckle-releases, mode: "0755" }
  - file.download:
      url: 'https://github.com/cedi/rpi_exporter/releases/download/v{{ vars.rpi_exporter_version }}/rpi_exporter_{{ vars.rpi_exporter_version }}_linux_arm64.tar.gz'
      dest: '/var/cache/buckle-releases/rpi_exporter_{{ vars.rpi_exporter_version }}.tar.gz'
      checksum: 'https://github.com/cedi/rpi_exporter/releases/download/v{{ vars.rpi_exporter_version }}/checksums.txt'
      mode: "0644"
    tags: [network]
  - archive.extract:
      src: '/var/cache/buckle-releases/rpi_exporter_{{ vars.rpi_exporter_version }}.tar.gz'
      dest: '/opt/rpi_exporter/{{ vars.rpi_exporter_version }}'
      include: [rpi_exporter]
      creates: rpi_exporter
  # The unit runs the binary from its versioned directory, so nothing claims
  # /usr/local/bin/rpi_exporter: the github.release task this replaces deletes
  # the binary it put there (removal: cleanup), and that's fine.

  # Older versions and their tarballs, once the pinned one is in place (the
  # running process keeps its binary's inode until the restart).
  - command.run:
      run: >-
        find /opt/rpi_exporter -mindepth 1 -maxdepth 1 ! -name '{{ vars.rpi_exporter_version }}' -exec rm -rf {} + ;
        find /var/cache/buckle-releases -maxdepth 1 -name 'rpi_exporter_*.tar.gz' ! -name 'rpi_exporter_{{ vars.rpi_exporter_version }}.tar.gz' -delete
      only_if: >-
        test -x '/opt/rpi_exporter/{{ vars.rpi_exporter_version }}/rpi_exporter' &&
        { find /opt/rpi_exporter -mindepth 1 -maxdepth 1 ! -name '{{ vars.rpi_exporter_version }}';
        find /var/cache/buckle-releases -maxdepth 1 -name 'rpi_exporter_*.tar.gz' ! -name 'rpi_exporter_{{ vars.rpi_exporter_version }}.tar.gz'; } | grep -q .
    id: rpi-exporter-old-versions
    removal: leave

  - user.account:
      name: rpi_exporter
      shell: /sbin/nologin
      groups: [video]                # vcgencmd needs /dev/vchiq

  - file.template:
      src: rpi_exporter.service.j2
      dest: /etc/systemd/system/rpi_exporter.service
      mode: "0644"
    notify: [restart]

  - systemd.unit: { name: rpi_exporter, enabled: true, active: true, daemon_reload: true }

handlers:
  restart: { systemd.restart: { name: rpi_exporter } }

health:
  - name: metrics
    http:
      url: 'http://127.0.0.1:{{ vars.rpi_exporter_port }}/'
      expect: { body_contains: Metrics }
