name: k3s-agent
description: k3s worker nodes, joined to the server through svc:labk3s, over the tailnet.
when: 'host.groups contains "k3s-agent"'
# After the k3s server, also inside a phase: a joining agent needs its API.
needs: [base, 'group:k3s-server']
tags: [k3s]
# A change here restarts k3s under the node's pods: labk3s drains the node
# first (maintenance in buckle.yaml).
# TEMPORARY for the switch to the tailnet: no drain, so all nodes switch
# within minutes instead of leaving a LAN/tailnet mix for half an hour
# (flannel can't bridge the two). Restored by the next commit.
# disrupts: node
# One worker at a time, whatever changes on it (a Buckle limit counts every
# host that runs the module while its plan changes anything): the other
# three, and the server, take the drained node's pods.
parallel: 4   # TEMPORARY (see above); normally 1
vars:
  # The Tailscale Service in front of the API (modules/k3s-server).
  k3s_server: 'labk3s.{{ vars.tailnet }}'
  k3s_api_port: 6443
tasks:
  - sysctl.param: { name: net.ipv4.ip_forward, value: 1 }
  - sysctl.param: { name: net.ipv6.conf.all.forwarding, value: 1 }

  - github.release:
      repo: k3s-io/k3s
      version: '{{ vars.k3s_version }}'
      asset: 'k3s-{arch}'                 # aarch64 -> k3s-arm64; every k3s node is a Pi
      checksum_asset: 'sha256sum-{arch}.txt'
      dest: /usr/local/bin/k3s
      mode: "0755"
      probe: [/usr/local/bin/k3s, --version]
      probe_regex: 'k3s version (v\S+)'
    tags: [network]
    notify: [restart]

  - file.directory: { path: /etc/rancher/k3s, mode: "0755" }
  - file.template:
      src: config.yaml.j2
      dest: /etc/rancher/k3s/config.yaml
      mode: "0600"
    notify: [restart]
  - file.copy: { src: k3s-agent.service, dest: /etc/systemd/system/k3s-agent.service, mode: "0644" }
    notify: [restart]
  - systemd.unit: { name: k3s-agent, enabled: true, active: true, daemon_reload: true }

  - file.absent: { path: /etc/systemd/system/k3s-agent.service.env }
    removal: leave
  - file.absent: { path: /usr/local/bin/k3s-install.sh }
    removal: leave

handlers:
  restart: { systemd.restart: { name: k3s-agent } }

actions:
  reboot:
    name: Reboot node
    description: Reboot this k3s agent (drain it first with kubectl if workloads matter)
    system.reboot: { delay: 5s, timeout: 10m }
    confirm: true

health:
  - name: unit
    systemd: { unit: k3s-agent, state: active, min_uptime: 60s }
  # The kubelet answers its own health endpoint: the node is running pods,
  # not just a k3s process that hasn't registered yet.
  - name: kubelet
    http: { url: 'http://127.0.0.1:10248/healthz', expect: { status: 200, body_contains: ok } }
