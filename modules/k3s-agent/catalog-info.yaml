# Backstage catalog entry for the k3s workers. Not read by Buckle: Backstage
# reads it through the Location in the repo-root catalog-info.yaml.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: k3s-agent
  title: k3s agent
  description: >-
    k3s on clusterpi-worker1..4, reaching the server only through svc:labk3s;
    node addresses and flannel on the tailnet.
    Rolled one worker at a time after the server, each drained first.
  annotations:
    github.com/project-slug: cedi/homelab
    # The tags its traffic comes from on the tailnet (the workers').
    specht-labs.de/tailnet-src: tag:k3s-node
spec:
  type: service
  owner: group:spechtlabs
  system: labk3s
  lifecycle: production
  providesApis:
    - api:labk3s-node-mesh
  consumesApis:
    - api:labk3s-kubernetes-api
    - api:labk3s-node-mesh
  dependsOn:
    - component:k3s-server
    - resource:clusterpi-worker1
    - resource:clusterpi-worker2
    - resource:clusterpi-worker3
    - resource:clusterpi-worker4
    - resource:tailnet
