# Managed by Buckle (modules/pi-firmware).
# systemd feeds the SoC's hardware watchdog (bcm2835_wdt, /dev/watchdog0) while
# the system runs: a frozen kernel or PID 1 resets the Pi after 15 s instead of
# hanging until someone power-cycles it. The hardware counts to ~15 s at most.
# Shutdown keeps systemd's default RebootWatchdogSec (10 min).
[Manager]
RuntimeWatchdogSec=15s
