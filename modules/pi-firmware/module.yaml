name: pi-firmware
description: Raspberry Pi boot firmware (config.txt [all], cmdline.txt), reboots when either changes; WiFi off; the hardware watchdog armed.
when: 'host.groups contains "pi"'
needs: [pi-facts]          # the PoE HAT task keys off host.facts.script.rpi
tags: [base, hardware]
vars:
  # Fan trip points in millidegrees C: the PoE+ HAT fan and the Pi 5 active cooler.
  rpi_fan_temps: [65000, 70000, 75000, 80000]
  # PCIe link speed for NVMe on the Pi 5. Gen 2 is the certified speed; Gen 3
  # (what Ansible set) made NVMe drop off the bus under load on 2026-11-18:
  # clusterpi-leader, storagepi-ceph1 and -ceph3 stopped doing I/O until power
  # cycled. Raise only per host, and watch it.
  rpi_pciex1_gen: 2
  # GPS/PPS board wiring (UART, I2C, SPI, PPS on GPIO 18); set per host.
  rpi_gps_pps: false
  rpi_pps_gpio: 18
  # A one-shot fallback to the SD card's own root filesystem, for a Pi whose
  # cmdline.txt mounts its root from elsewhere (timepi: NVMe). The SD root's
  # PARTUUID=..., set per host; empty: none. See rpi-sd-fallback below.
  rpi_sd_fallback_root: ''
  # Kernel image to boot instead of the firmware's default; set per group.
  # On a Pi 5, kernel8.img is the 4K-page kernel (the default kernel_2712.img
  # uses 16K pages, which some software can't run on: Ceph's BlueStore).
  rpi_kernel: ''
# Each task owns only the lines and keys it lists; the rest of config.txt is
# left alone. Ansible inserted its lines with `insertafter: "[all]"`, which is a
# regex character class, not a section, so they may sit in another section:
# review each host's first plan for duplicates.
tasks:
  - file.ini:
      path: /boot/firmware/config.txt
      section: all
      lines: [dtoverlay=rpi-poe-plus]
      settings:
        dtparam=poe_fan_temp0: '{{ vars.rpi_fan_temps[0] }}'
        dtparam=poe_fan_temp1: '{{ vars.rpi_fan_temps[1] }}'
        dtparam=poe_fan_temp2: '{{ vars.rpi_fan_temps[2] }}'
        dtparam=poe_fan_temp3: '{{ vars.rpi_fan_temps[3] }}'
    id: rpi-poe-hat
    when: 'host.facts.script.rpi.hat_product contains "PoE"'
    notify: [reboot]

  - file.ini:
      path: /boot/firmware/config.txt
      section: all
      settings:
        dtparam=fan_temp0: '{{ vars.rpi_fan_temps[0] }}'
        dtparam=fan_temp1: '{{ vars.rpi_fan_temps[1] }}'
        dtparam=fan_temp2: '{{ vars.rpi_fan_temps[2] }}'
        dtparam=fan_temp3: '{{ vars.rpi_fan_temps[3] }}'
    id: rpi5-cooling
    when: 'host.facts.hardware.raspberry_pi.version == 5'
    notify: [reboot]

  # Every Pi 5, not just where pi-facts sees NVMe: a marginal NVMe link comes
  # and goes between boots (timepi's), and a fact that flaps would make Buckle
  # remove the setting again. Gen 2 is the default anyway. (The id is
  # historical: it set Gen 3 before 2026-11-18.)
  - file.ini:
      path: /boot/firmware/config.txt
      section: all
      settings:
        dtparam=pciex1_gen: '{{ vars.rpi_pciex1_gen }}'
    id: rpi5-pcie-gen3
    when: 'host.facts.hardware.raspberry_pi.version == 5'
    notify: [reboot]

  # auto_initramfs=1 loads the matching initramfs (kernel8.img: initramfs8),
  # which raspi-firmware's hooks keep current for every flavour.
  - file.ini:
      path: /boot/firmware/config.txt
      section: all
      settings: { kernel: '{{ vars.rpi_kernel }}' }
    id: rpi-kernel
    when: 'vars.rpi_kernel != ""'
    notify: [reboot]

  - file.ini:
      path: /boot/firmware/config.txt
      section: all
      lines:
        - 'dtoverlay=pps-gpio,gpiopin={{ vars.rpi_pps_gpio }}'
        - dtparam=i2c_arm=on
        - dtparam=i2s=on
        - dtparam=spi=on
        - dtparam=uart0=on
      settings: { enable_uart: 1 }
    id: rpi-gps-pps
    when: 'vars.rpi_gps_pps == true'
    notify: [reboot]

  # Ethernet only. WiFi off now through NetworkManager (it keeps that across
  # reboots), and off in the firmware from the next boot; on its own that
  # line reboots nothing (no notify), so 14 Pis don't restart for it at once.
  # Every Pi's addresses that matter (k3s node IPs, flannel, timepi's NTP)
  # are on eth0.
  - command.run:
      run: [nmcli, radio, wifi, 'off']
      unless: [sh, -c, 'nmcli -t radio wifi | grep -qx disabled']
    id: rpi-wifi-off
    removal: leave
  - file.ini:
      path: /boot/firmware/config.txt
      section: all
      lines: [dtoverlay=disable-wifi]
    id: rpi-wifi-disabled

  - file.tokens:
      path: /boot/firmware/cmdline.txt
      present: [cgroup_enable=cpuset, cgroup_memory=1, cgroup_enable=memory]
    id: rpi-cmdline-cgroups
    notify: [reboot]

  # NVMe power-state transitions (APST): WD SN770s and others drop off the Pi's
  # PCIe bus coming out of a deep power state. Disable them on every Pi 5 (as
  # above, whether or not the drive showed up this boot) and on any other Pi
  # with NVMe (the CM4 blades). A no-op without NVMe.
  - file.tokens:
      path: /boot/firmware/cmdline.txt
      present: [nvme_core.default_ps_max_latency_us=0]
    id: rpi-nvme-no-apst
    when: 'host.facts.hardware.raspberry_pi.version == 5 || host.facts.script.rpi.nvme == true'
    notify: [reboot]

  # The serial console would fight gpsd for the UART.
  - file.tokens:
      path: /boot/firmware/cmdline.txt
      absent: [console=serial0]
    id: rpi-cmdline-no-serial-console
    when: 'vars.rpi_gps_pps == true'
    notify: [reboot]

  # The SD-root fallback (rpi_sd_fallback_root): tryboot.txt is config.txt
  # plus `cmdline=cmdline-sd.txt`, cmdline-sd.txt is cmdline.txt with the SD's
  # root=, so `reboot '0 tryboot'` boots the SD root once. Both are derived
  # from the live files after the tasks above have edited them, so the
  # fallback always carries the same overlays and tokens (it was hand-made on
  # 2026-11-19 and drifted with every config.txt change). Nothing reboots for
  # it: tryboot.txt is read only when asked for. The script writes only these
  # two files and refuses a root that doesn't exist.
  - file.copy: { src: rpi-sd-fallback.sh, dest: /usr/local/sbin/rpi-sd-fallback, mode: "0755" }
    id: rpi-sd-fallback-script
    when: 'vars.rpi_sd_fallback_root != ""'
  - command.run:
      run: [/usr/local/sbin/rpi-sd-fallback, '{{ vars.rpi_sd_fallback_root }}']
      unless: [/usr/local/sbin/rpi-sd-fallback, '{{ vars.rpi_sd_fallback_root }}', --check]
    id: rpi-sd-fallback
    when: 'vars.rpi_sd_fallback_root != ""'
    removal: leave

  # Hardware watchdog. clusterpi-worker3 froze hard on 2026-11-23 (no ping, no
  # log, kernel and all) and stayed down until power-cycled; systemd only armed
  # the watchdog for shutdowns. Applied with daemon-reexec, which services
  # survive (k3s, Ceph); guarded on the live value, so an interrupted run
  # catches up on the next pass instead of depending on a handler.
  - file.directory: { path: /etc/systemd/system.conf.d, mode: "0755" }
    id: systemd-conf-dir
    removal: leave
  - file.copy: { src: watchdog.conf, dest: /etc/systemd/system.conf.d/90-watchdog.conf, mode: "0644" }
    id: watchdog-conf
  - command.run:
      run: [systemctl, daemon-reexec]
      only_if: 'test "$(systemctl show -p RuntimeWatchdogUSec --value)" != 15s'
    id: watchdog-arm
    removal: leave

handlers:
  reboot: { system.reboot: { delay: 10s, timeout: 5m } }

health:
  # A Pi with an SD-root fallback boots from the SD card only. timepi's NVMe
  # hangs the kernel whenever the bootloader touched it first (2026-11-19:
  # BOOT_ORDER with NVMe, 6, and PCIE_PROBE=1 took the LAN's only stratum 1
  # down). This can't stop anyone flashing the EEPROM, but a rollout stops
  # here instead of the next reboot finding out. A no-op on the other Pis.
  - name: sd-boot-only
    command:
      run:
        - sh
        - -c
        - >-
          test -z '{{ vars.rpi_sd_fallback_root }}' || {
          c=$(rpi-eeprom-config) &&
          o=$(printf '%s\n' "$c" | sed -n 's/^BOOT_ORDER=0x//p') &&
          test -n "$o" &&
          case "$o" in *6*) false ;; esac &&
          ! printf '%s\n' "$c" | grep -q '^PCIE_PROBE=1'; }
      expect: { exit: 0 }
  - name: watchdog-armed
    command:
      run: [systemctl, show, -p, RuntimeWatchdogUSec, --value]
      expect: { stdout_matches: '(?m)^15s$' }
