name: ptp-facts
description: A custom fact provider exposing whether the NIC that reaches timepi timestamps PTP in hardware, as host.facts.script.ptp.
when: 'host.groups contains "ntp-client"'
tags: [base, hardware, time]
facts:
  provides: [script]
tasks:
  # The facts script asks the NIC through ethtool; Raspberry Pi OS lacks it.
  - apt.package: { name: ethtool }
  # Shared with pi-facts: neither module may take it away from the other.
  - file.directory: { path: /var/lib/buckle/facts.d, mode: "0700" }
    removal: leave
  - file.template:
      src: ptp-facts.sh.j2
      dest: /var/lib/buckle/facts.d/ptp
      mode: "0755"
      owner: root
      group: root
