name: ptp-facts
description: A custom fact provider exposing how the host reaches timepi (on the home LAN, and whether that NIC timestamps PTP in hardware), as host.facts.script.ptp.
# Every host: ntp-client and ptp-client are derived from this fact.
when: 'host.groups contains "debian"'
tags: [base, hardware, time]
facts:
  provides: [script]
tasks:
  # The facts script asks the NIC through ethtool; Raspberry Pi OS lacks it.
  - apt.package: { name: ethtool }
  # Shared with pi-facts: neither module may take it away from the other.
  - file.directory: { path: /var/lib/buckle/facts.d, mode: "0700" }
    removal: leave
  - file.template:
      src: ptp-facts.sh.j2
      dest: /var/lib/buckle/facts.d/ptp
      mode: "0755"
      owner: root
      group: root
