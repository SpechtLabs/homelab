# Homelab fleet, managed by Buckle (https://buckle.sierrasoftworks.com).
#
# Nothing in here lists hosts. Groups are derived from facts the agents report
# (Raspberry Pi generation, HAT EEPROM, Tailscale tags) and, where hardware
# can't tell, from host-id globs. A host's id is its tailnet node name.
version: 2

fleet:
  groups:
    # What the machine is
    debian: 'host.facts.os.family == "debian"'
    pi:     'host.facts.hardware.raspberry_pi.version != null'
    pi5:    'host.facts.hardware.raspberry_pi.version == 5'

    # What the machine is for
    k3s-server: 'host.id == "clusterpi-leader"'
    k3s-agent:  'host.id like "clusterpi-worker*"'
    ceph:       'host.id like "storagepi-ceph*"'
    # Compute Modules only run on the compute blades here: the blade board has
    # no ID of its own (no HAT EEPROM; its fan unit and I2C show up only once
    # compute-blade-agent's overlays are in), so the CM4 is the hardware fact.
    blades:     'host.facts.hardware.raspberry_pi.compute_module == true'
    # The GPS board's PPS is wired to a GPIO (modules/pi-facts). The board has
    # no ID EEPROM, so its overlay is declared once with the host's hardware
    # (vars/host-timepi.yaml, rpi_gps_pps); the role follows from the result.
    ptp-grandmaster: 'host.facts.script.rpi.pps_gpio == true'
    # Everything on the home LAN syncs from timepi (modules/ptp-facts: timepi
    # is on-link; false on timepi itself and on hosts elsewhere).
    ntp-client:      'host.facts.script.ptp.lan == true'
    # ... by PTP where the NIC timestamps in hardware and has its own clock,
    # as ptp-facts finds out with ethtool (the Pi 5s, the CM4 blades and isa
    # today; not the Pi 4s or the NUC). Needs a Pi kernel past 6.12.34 (its
    # PHCs refuse every adjustment); every Pi runs 6.12.115 since 2026-11-19
    # and the nightly upgrades keep it that way.
    ptp-client:      'host.facts.script.ptp.lan == true && host.facts.script.ptp.hardware == true'
    # By host, not by tag: a retag reaches Buckle only when the agent next
    # reports facts, so a tag-derived role can't move in one rollout. The
    # tag still grants the network access (tailscale/policy.hujson).
    o11y-collector:  'host.id == "isa"'
    spechtlabs:      'host.id in ["hole", "meet"]'
    jitsi:           'host.id == "meet"'
    tsidp:           'host.id == "isa"'
    buckle-server:   'host.id == "isa"'   # by host, like o11y-collector

    # Power: isa proxies the Synology's UPS; the Pis and the NUC shut down
    # early unless they are the ones that should outlive the cluster.
    nut-server: 'host.id == "isa"'
    nut-client: 'host.facts.hardware.raspberry_pi.version != null || host.id == "nuc"'
    nut-late:   'host.id in ["jumphost", "timepi"]'

  # The k3s cluster as a Buckle target. The executor is the k3s server and
  # uses its own admin kubeconfig (/etc/rancher/k3s/k3s.yaml): identity local.
  # Buckle owns only the root Argo CD Application here (workloads/argocd-root);
  # Argo CD deploys everything else, itself included, from k8s-deployment.
  clusters:
    labk3s:
      kind: kubernetes
      nodes:     'host.groups contains "k3s-server" || host.groups contains "k3s-agent"'
      executors: 'host.groups contains "k3s-server"'
      identity: local
      labels: { site: home }
      # A rollout cordons and drains a node before a run that disrupts it (a
      # reboot, or a change to a module marked disrupts: node: k3s-server,
      # k3s-agent) and uncordons it once the host is healthy again. 10m for
      # the pods to move before the drain counts as failed.
      maintenance: { drain: disruptive, deadline: 10m }

# Broad to narrow; later wins. Module defaults sit below all of these.
vars:
  - file: vars/defaults.yaml
  - file: vars/versions.yaml

  # hardware
  - when: 'host.facts.hardware.raspberry_pi.version != null'
    file: vars/hw-pi.yaml

  # role
  - when: 'host.groups contains "blades"'
    file: vars/group-blades.yaml
  - when: 'host.groups contains "nut-late"'
    values: { nut_shutdown_affinity: late }
  - when: 'host.groups contains "spechtlabs"'
    file: vars/group-spechtlabs.yaml
  - when: 'host.groups contains "o11y-collector"'
    file: vars/group-o11y-collector.yaml
  - when: 'host.groups contains "ceph"'
    file: vars/group-ceph.yaml

  # host exceptions
  - when: 'host.id == "nuc"'
    file: vars/host-nuc.yaml
  - when: 'host.id == "isa"'
    file: vars/host-isa.yaml
  - when: 'host.id == "hole"'
    file: vars/host-hole.yaml
  - when: 'host.id == "meet"'
    file: vars/host-meet.yaml
  - when: 'host.id == "timepi"'
    file: vars/host-timepi.yaml
  - when: 'host.id == "jumphost"'
    values: { dotfiles_preset: core }

# References only. On the server these resolve under
# secrets.providers.file.root (/etc/buckle/secrets).
secrets:
  K3S_TOKEN:              { file: /etc/buckle/secrets/K3S_TOKEN }
  NUT_UPSTREAM_PASSWORD:  { file: /etc/buckle/secrets/NUT_UPSTREAM_PASSWORD }
  NUT_ADMIN_PASSWORD:     { file: /etc/buckle/secrets/NUT_ADMIN_PASSWORD }
  NUT_MONITOR_PASSWORD:   { file: /etc/buckle/secrets/NUT_MONITOR_PASSWORD }
  # age private key for k8s-deployment's SOPS secrets: the one thing a fresh
  # cluster's Argo CD can't get from git (modules/argocd-seed).
  ARGOCD_AGE_KEY:         { file: /etc/buckle/secrets/ARGOCD_AGE_KEY }
  # Jitsi on meet (modules/jitsi): the bridge's and jicofo's XMPP passwords
  # (their Prosody accounts must match) and the TURN secret (coturn + Prosody).
  JITSI_JVB_PASSWORD:     { file: /etc/buckle/secrets/JITSI_JVB_PASSWORD }
  JITSI_FOCUS_PASSWORD:   { file: /etc/buckle/secrets/JITSI_FOCUS_PASSWORD }
  JITSI_TURN_SECRET:      { file: /etc/buckle/secrets/JITSI_TURN_SECRET }

rollout:
  trigger: auto            # every valid revision on main starts a rollout
  supersede: latest
  on_failure: pause
  # No bakes: a host is healthy once its required checks pass (unit uptimes,
  # kubelet and API readiness, Ceph recovered, ...), not after a fixed wait.
  # settle is how long a failing check may keep failing while a service
  # restarts before it counts.
  settle: 2m
  health:
    # Explicitly zero: the default (5m) holds each phase after its last apply.
    # Before a phase starts, every host the rollout already updated is checked
    # again; that, not a wait, is the gate.
    bake: 0s
    baseline: hold
  stragglers:
    parallel: 1
    approval: auto
  # A host belongs to the first phase that selects it. The blades prove a
  # revision, then core (everything else leans on these), then the rest in one
  # phase, ordered and limited by the modules themselves.
  phases:
    # No approval: the blades' health checks are the gate. A failure pauses
    # the rollout (on_failure: pause) before any other host. All four at once:
    # the blades carry nothing else depends on.
    - name: canary
      select: 'host.groups contains "blades"'
      parallel: 4
      approval: auto
    # isa runs the Buckle server, tsidp, the NUT proxy and the o11y collector
    # (Buckle upgrades the server before its agents this way), timepi serves
    # the LAN's time, jumphost is the way in. Two at a time: none of them
    # needs another of them up to come back.
    - name: core
      select: 'host.id in ["nuc", "isa", "timepi", "jumphost"]'
      parallel: 2
      approval: auto
    # Everything else, hosts and labk3s: the k3s server and agents, the Ceph
    # hosts and meet. The modules set the order and the limits, not phases:
    #  - a module's parallel counts every host that runs it while that host's
    #    plan changes anything, whichever module changes it (a reboot from
    #    base or pi-firmware included). So ceph (parallel: 1) is one Ceph host
    #    at a time and k3s-agent (parallel: 1) one worker at a time;
    #  - k3s-agent needs group:k3s-server: the workers follow the server;
    #  - labk3s drains a node around a run that disrupts it (maintenance), and
    #    the drain holds the host's slot until the node is back.
    # 4 is what those limits leave room for: the k3s server or a worker, a
    # Ceph host and meet at once.
    - name: fleet
      select: 'true'
      parallel: 4
      approval: auto
