o11y_external_labels:
  hostname: meet.realschule-rottweil.de
o11y_log_paths:
  - /var/log/*.log
  - /var/log/jitsi/*.log
  - /var/log/prosody/*.log
  - /var/log/prosody/*.err
o11y_local_scrapes:
  - { job: jitsi_exporter, port: 8080 }

# Jitsi (modules/jitsi). Upgraded 2026-11-18 to the then-latest stable; pinned, so the
# nightly upgrade leaves them alone. Bump together, from download.jitsi.org's
# stable repo and packages.prosody.im.
jitsi_domain: meet.realschule-rottweil.de
jitsi_packages:
  jitsi-meet: 2.0.11509-1
  jitsi-meet-web: 1.0.9644-1
  jitsi-meet-web-config: 1.0.9644-1
  jitsi-meet-prosody: 1.0.9644-1
  jitsi-meet-turnserver: 1.0.9644-1
  jicofo: 1.0-1233-1
  jitsi-videobridge2: 2.3-358-gf8efaa72c-1
  prosody: 13.0.7-1~noble2
