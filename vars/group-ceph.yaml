# The Ceph cluster on storagepi-ceph1..3 (modules/ceph).
#
# Everything Ceph speaks goes over the tailnet: public_network is Tailscale's
# CGNAT range, so mons, OSDs and RGW bind to each host's 100.x address and
# clients (the k3s nodes, ceph-csi) find the mons by MagicDNS name. A node
# keeps its tailnet address for as long as it stays in the tailnet, which is
# what a mon needs: the monmap stores addresses, and a mon whose address
# changes won't start. Replacing a host's Tailscale node means re-adding its
# mon at the new address.

# 4K pages (modules/pi-firmware): on the Pi 5's default 16K-page kernel,
# BlueStore asserts while creating an OSD (BlueFS::append_try_flush,
# p2aligned(pos1 ^ pos2, _page_size); Ceph 20.2.5, 2026-11-18).
rpi_kernel: kernel8.img

# Where cephadm bootstraps the cluster and where Buckle applies the specs.
ceph_admin_host: storagepi-ceph1

# The cluster's hosts and their tailnet IPv4 addresses (`tailscale ip -4`).
# cephadm can't see these itself (`cephadm list-networks` only reads the main
# routing table, Tailscale's routes live in table 52), so mons are placed at
# these addresses explicitly. A host joins once it has the cephadm key below.
ceph_hosts:
  storagepi-ceph1: 100.105.212.35
  storagepi-ceph2: 100.107.71.68
  storagepi-ceph3: 100.118.224.54

# Hosts that run the S3 gateway (RGW), on ceph_rgw_port: one, for experiments,
# away from the host with the active mgr.
ceph_rgw_hosts: [storagepi-ceph2]

# `ceph mon set <key> <value>`. Tentacle allows only aes256k cephx keys;
# kernel clients (krbd on the k3s nodes) need aes. aes256k stays preferred,
# daemons and every other client keep it.
ceph_mon_settings:
  auth_allowed_ciphers: aes,aes256k

# mgr modules to enable. prometheus serves the cluster's metrics on :9283
# (bootstrap --skip-monitoring-stack leaves it off).
ceph_mgr_modules: [prometheus]

# `ceph config set <who> <key> <value>` (modules/ceph, files/resources.sh.j2).
ceph_config:
  mgr:
    # Standby mgrs answer /metrics with an error instead of redirecting to the
    # active one: Alloy would follow and record its metrics a second time.
    mgr/prometheus/standby_behaviour: error
    # Per-image RBD metrics (RBD dashboards) for the k3s pool.
    mgr/prometheus/rbd_stats_pools: k3s
  osd:
    # cephadm's autotune lands below the 896 MiB minimum on these 8 GB hosts
    # (mon, three mgrs, RGW); 2 GiB per OSD instead.
    osd_memory_target_autotune: 'false'
    osd_memory_target: '2147483648'

# Metrics (modules/alloy, to the homelab Mimir tenant): the mgr's prometheus
# module and ceph-exporter, labelled with the cluster name the Ceph
# dashboards select on. Replaces vars/hw-pi.yaml's list, so rpi_exporter again.
o11y_local_scrapes:
  - { job: rpi_exporter, port: 9243 }
  - { job: ceph_mgr, port: 9283, labels: { cluster: homelab-ceph } }
  - { job: ceph_exporter, port: 9926, labels: { cluster: homelab-ceph } }

# RBD pools, client keys (name: {daemon: caps}) and S3 users (uid: display
# name), created by modules/ceph (files/resources.sh.j2).
ceph_rbd_pools: [k3s]
ceph_clients:
  # ceph-csi on labk3s (k8s-deployment apps/ceph-csi-rbd). AES-128: it maps
  # images with the kernel's rbd client, and the k3s nodes' libceph (6.6,
  # 6.12) can't parse aes256k keys ("Failed to parse secret: -524").
  k3s:
    key_type: aes
    caps:
      mon: profile rbd
      osd: profile rbd pool=k3s
      mgr: profile rbd pool=k3s
ceph_rgw_users:
  experiments: S3 experiments

# cephadm's SSH public key (`ceph cephadm get-pub-key`; bootstrap made it
# 2026-11-18). root on every Ceph host accepts it from tailnet addresses.
ceph_cephadm_pubkey: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAqO3vD/QF7X+uPmH8N1KiiWXI4UrYAFgsHRkLCAeoyk ceph-85412c6c-e39c-11f1-ba59-2ccf678b0944'
