# Every host. Module defaults live in each module.yaml; this file holds what
# several modules share.
tailnet: sphinx-map.ts.net

# The account people log in as: it gets cedi/dotfiles and fish as login shell.
# Pis use `pi`; overlays set the rest (cedi on the NUC and timepi, root on VPS hosts).
admin_user: pi
admin_home: '{{ "/root" if vars.admin_user == "root" else "/home/" ~ vars.admin_user }}'
login_shell: /usr/bin/fish

# o11y: homelab stack by default; spechtlabs hosts override the endpoints.
o11y_loki_url: http://homelab-loki.k8s.specht-labs.de/loki/api/v1/push
o11y_mimir_url: http://homelab-mimir.k8s.specht-labs.de/api/v1/push
o11y_tempo_url: http://homelab-tempo.k8s.specht-labs.de
o11y_log_paths: ["/var/log/*.log"]
o11y_external_labels: {}
# Exporters on this host, scraped over localhost: {job, port[, path, labels, honor_labels]}
o11y_local_scrapes: []
# Collector only: other machines' exporters: {name, job, targets[, path, params]}
o11y_remote_scrapes: []
o11y_otlp_receiver: false
alloy_custom_args: ""

# NUT
nut_server_host: 'nuc.{{ vars.tailnet }}'
nut_ups_name: ups

# Time (modules/time-sync): timepi's LAN address (keep its DHCP lease fixed;
# the tailnet name would make time depend on Tailscale coming up first).
ntp_server: 192.168.0.109
ntp_fallback: 0.debian.pool.ntp.org 1.debian.pool.ntp.org 2.debian.pool.ntp.org 3.debian.pool.ntp.org
