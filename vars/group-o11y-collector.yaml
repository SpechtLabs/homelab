# The collector: receives OTLP from the cluster and scrapes the machines that
# can't run Alloy themselves (the Synology, Tailscale proxies).
o11y_otlp_receiver: true
alloy_custom_args: --server.http.listen-addr=0.0.0.0:12345
o11y_remote_scrapes:
  - name: nas_node_exporter
    job: node_exporter
    targets: ["nas-elbschloss:9100"]
  - name: snmp_exporter
    job: snmp
    targets: ["192.168.0.64:9116"]
    path: /snmp
    params: { module: [synology], auth: [snmpv3], target: [nas] }
  - name: cadvisor
    job: cadvisor
    targets: ["192.168.0.64:8123"]
  # tailscaled metrics. 100.100.100.100 is this node's own; the :5252 ones are
  # copied as-is from the Ansible config: they are not Buckle agents.
  - name: tailscale_exporter
    job: tailscale_exporter
    targets:
      - "100.100.100.100"
      - "100.65.216.48:5252"
      - "100.92.89.43:5252"
      - "100.94.152.81:5252"
      - "100.123.236.103:5252"
      - "100.126.248.78:5252"
      - "100.103.254.83:5252"
      - "100.95.24.14:5252"
      - "100.122.149.90:5252"
      - "100.83.246.57:5252"
      - "100.85.86.18:5252"

# Availability SLIs: probe_success per service, every 30 s (SLOs in
# SpechtLabs/k8s-deployment grafana/slos/). Each URL is what users reach:
# tailnet names and Tailscale Services (tailscale/policy.hujson grants the
# collector svc:labk3s and svc:stream for this).
o11y_probes:
  - { name: buckle, service: buckle, module: http_2xx, url: "https://buckle.sphinx-map.ts.net/readyz" }
  - { name: tsidp, service: tsidp, module: http_oidc_discovery, url: "https://idp.sphinx-map.ts.net/.well-known/openid-configuration" }
  - { name: home-assistant, service: home-assistant, module: http_2xx, url: "http://hass.sphinx-map.ts.net:8123/" }
  - { name: labk3s-api, service: labk3s-api, module: http_401_insecure, url: "https://labk3s.sphinx-map.ts.net:6443/readyz" }
  - { name: nas-dsm, service: nas, module: http_2xx, url: "https://nas.sphinx-map.ts.net/" }
  - { name: jellyfin, service: jellyfin, module: http_2xx, url: "https://stream.sphinx-map.ts.net/health" }
