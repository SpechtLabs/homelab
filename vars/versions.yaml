# Pinned versions. Renovate bumps these through the regex manager in renovate.json;
# a merged bump rolls out through the phases in buckle.yaml.

# Buckle itself: agents everywhere, and the server on the NUC (modules/buckle).
# renovate: datasource=github-releases depName=SierraSoftworks/buckle extractVersion=^v(?<version>.*)$
buckle_version: 2.15.0
# renovate: datasource=github-releases depName=k3s-io/k3s
k3s_version: v1.31.1+k3s1
# renovate: datasource=github-releases depName=grafana/alloy extractVersion=^v(?<version>.*)$
alloy_version: 1.22.0
# renovate: datasource=github-releases depName=cedi/rpi_exporter extractVersion=^v(?<version>.*)$
rpi_exporter_version: 1.0.10
# renovate: datasource=github-releases depName=tailscale/tsidp extractVersion=^v(?<version>.*)$
tsidp_version: 0.0.20

# A commit, not a branch: following main would make every dotfiles push look
# like drift, auto-corrected on every host within 15 minutes, outside any
# rollout. Renovate proposes newer commits as PRs instead.
# renovate: datasource=git-refs depName=https://github.com/cedi/dotfiles branch=main
dotfiles_ref: 9ebf53033af6d29eb734a898c1c6bd67c8a9ab8b

# Tools the Argo CD seed renders k8s-deployment with; keep in step with that
# repo's .mise.toml.
# renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.*)$
argocd_seed_kustomize_version: 5.8.3
# renovate: datasource=github-releases depName=helm/helm extractVersion=^v(?<version>.*)$
argocd_seed_helm_version: 4.3.2
# renovate: datasource=github-releases depName=viaduct-ai/kustomize-sops extractVersion=^v(?<version>.*)$
argocd_seed_ksops_version: 4.5.1
